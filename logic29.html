<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Logic 29</title>
<style>
  .question-block {
    position: relative;
    padding: 10px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
  }
  .delete-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: #e0e0e0;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    color: #333;
  }
  .delete-btn:hover {
    background: #ff4d4d;
    color: white;
  }
</style>
</head>
<body>

<div class="question-block" id="q2">
<h3>Question 2</h3>
<p>What is 2 + 2?</p>
</div>
<script>
    // JS for Delete
    document.addEventListener("DOMContentLoaded", function() {
        const blocks = document.querySelectorAll('.question-block');
        blocks.forEach((block, index) => {
            if (!block.id) {
                block.id = 'question_' + index;
            }
            
            const btn = document.createElement('button');
            btn.className = 'delete-btn';
            btn.innerHTML = '🗑️ Xóa';
            btn.onclick = function() {
                block.style.display = 'none';
                fetch('http://127.0.0.1:9999/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_name: 'logic29.html',
                        question_id: block.id
                    })
                }).catch(err => console.error(err));
            };
            block.appendChild(btn);
        });
    });
  </script>
</body>
</html>
