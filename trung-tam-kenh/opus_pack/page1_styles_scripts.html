<!-- STYLES FROM PAGE 1 (cu/index.html) -->
<style>

    @font-face {
      font-family: 'FD Aeonik Extended';
      src: url('./fonts/FDAeonikExtended-Regular.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonikExtended-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik Extended';
      src: url('./fonts/FDAeonikExtended-Bold.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonikExtended-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FD Integral';
      src: url('./fonts/SVN-IntegralCF-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FD Integral';
      src: url('./fonts/SVN-IntegralCF-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-Regular.woff2?v=2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-Bold.woff2?v=2') format('woff2');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-Semibold.woff2?v=2') format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-RegularItalic.woff2?v=2') format('woff2');
      font-weight: 400; font-style: italic; font-display: swap;
    }

    
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonik-Regular.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonik-Regular.ttf') format('truetype'),
           local('FD Aeonik Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonik-Medium.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonik-Medium.ttf') format('truetype'),
           local('FD Aeonik Medium');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonik-Bold.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonik-Bold.ttf') format('truetype'),
           local('FD Aeonik Bold');
      font-weight: 600 700;
      font-style: normal;
      font-display: swap;
    }
    
    
    

    :root {
      --cl-bg: #ffffff;
      --cl-tint: #f8fafc;
      --cl-line: #e2e8f0;
      --cl-text-base: #090d16;
      --cl-text-body: #0f172a;
      --cl-text-muted: #475569;
      --cl-accent: #1a73e8;
      --cl-accent-soft: rgba(26, 115, 232, 0.08);

      --font-display-short: 'FD Aeonik Extended', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display-long: 'FD Aeonik', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Tiempos Text Web', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', Consolas, Monaco, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html {
      background-color: var(--cl-bg);
      color: var(--cl-text-base);
      font-family: var(--font-body);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      line-height: 1.8;
      padding-bottom: 80px;
    }

    /* Top Bar */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--cl-line);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-display-long);
    }
    .top-nav__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--cl-text-base);
    }
    .top-nav__badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: var(--cl-text-base);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.08em;
    }
    .top-nav__title {
      font-family: var(--font-display-short); text-transform: uppercase;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .top-nav__links {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .top-nav__link {
      color: var(--cl-text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .top-nav__link:hover {
      color: var(--cl-accent);
    }

    /* Sections */
    .cl-zebra-section {
      width: 100%;
      padding: clamp(48px, 6vw, 84px) 20px;
      border-bottom: 1px solid var(--cl-line);
    }
    .cl-zebra--light { background-color: var(--cl-bg); }
    .cl-zebra--tint { background-color: var(--cl-tint); }

    .cl-sec-container {
      max-width: 820px;
      margin: 0 auto;
    }

    .cl-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cl-accent);
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cl-accent-soft);
      padding: 4px 12px;
      border-radius: 100px;
    }
    .cl-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--cl-accent);
      border-radius: 50%;
    }

    .title-short {
      font-family: var(--font-display-short); text-transform: uppercase;
      font-size: clamp(24px, 3.8vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--cl-text-base);
      margin-bottom: 16px;
      text-wrap: balance;
    }

    .title-long {
      font-family: var(--font-display-long);
      font-size: clamp(20px, 2.8vw, 26px);
      font-weight: 600;
      line-height: 1.35;
      color: var(--cl-text-base);
      margin-bottom: 14px;
    }

    .cl-body {
      font-family: var(--font-body);
      font-size: clamp(16.5px, 1.8vw, 18px);
      line-height: 1.85;
      color: var(--cl-text-body);
      margin-bottom: 20px;
    }

    .editorial-hook {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.65;
      color: var(--cl-text-base);
      border-left: 3px solid var(--cl-accent);
      padding-left: 20px;
      margin: 24px 0;
    }

    /* Cards */
    .apple-card {
      background: #ffffff;
      border: 1px solid var(--cl-line);
      border-radius: 16px;
      padding: clamp(20px, 3vw, 26px);
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(9, 13, 22, 0.03);
    }
    .apple-card__badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cl-accent);
      margin-bottom: 8px;
    }
    .apple-card__title {
      font-family: var(--font-display-long);
      font-size: 18px;
      font-weight: 700;
      color: var(--cl-text-base);
      margin-bottom: 10px;
    }

    .quote-box {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 16px 20px;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--cl-text-body);
      line-height: 1.7;
      margin: 14px 0;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }
    @media (max-width: 640px) {
      .comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    .compare-card {
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--cl-line);
    }
    .compare-card--wrong {
      background: #fffdfd;
      border-color: #fecaca;
    }
    .compare-card--right {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .compare-card__tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .compare-card--wrong .compare-card__tag { color: #dc2626; }
    .compare-card--right .compare-card__tag { color: #16a34a; }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cl-text-base);
      color: #ffffff;
      text-decoration: none;
      font-family: var(--font-display-long);
      font-size: 14.5px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      transition: opacity 0.2s;
      margin-top: 10px;
    }
    .btn-action:hover {
      opacity: 0.9;
    }

    .highlight-rule {
      background: #eff6ff;
      border-left: 4px solid var(--cl-accent);
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin: 20px 0;
      font-size: 16px;
    }
  
    /* ═══ CLEAN STICKY NAV ═══ */
    .sticky-nav {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 6px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      max-width: min(calc(100vw - 28px), 760px);
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .sticky-nav::-webkit-scrollbar { display: none; }
    .nav-dropdown-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #1a73e8;
      background: rgba(26, 115, 232, 0.08);
      border: 1px solid rgba(26, 115, 232, 0.25);
      padding: 5px 12px;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .nav-dropdown-btn:hover {
      background: #1a73e8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.28);
    }

</style>

<style>
        .flow-stage {
          background: #ffffff;
          border: 1px solid var(--cl-line);
          border-radius: 24px;
          padding: 36px 32px 32px 32px;
          margin-top: 24px;
          box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.04);
          font-family: var(--font-display-long);
          position: relative;
        }

        /* Thanh trạng thái kiểm tra tương tác */
        .flow-status-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 10px 16px;
          background: var(--cl-tint);
          border: 1px solid var(--cl-line);
          border-radius: 12px;
          margin-bottom: 28px;
          font-size: 13px;
          color: var(--cl-text-muted);
          transition: all 0.3s ease;
        }
        .flow-status-bar__left {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-weight: 600;
          color: var(--cl-text-base);
        }
        .flow-status-bar__dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #10b981;
          display: inline-block;
          box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
          animation: flowPulse 2s infinite;
        }
        @keyframes flowPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.25); opacity: 0.7; }
        }
        .flow-status-bar__hint {
          font-size: 12px;
          color: var(--cl-text-muted);
        }
        .flow-status-reset {
          background: none;
          border: none;
          color: var(--cl-accent);
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
          display: none;
          padding: 2px 8px;
          border-radius: 4px;
        }
        .flow-status-reset:hover {
          text-decoration: underline;
        }

        /* ROOT NODE */
        .flow-root {
          max-width: 440px;
          margin: 0 auto;
          background: #0b0f19;
          color: #ffffff;
          border-radius: 14px;
          padding: 20px 24px;
          text-align: center;
          position: relative;
          z-index: 2;
          box-shadow: 0 10px 25px -5px rgba(11, 15, 25, 0.25);
          border: 1px solid rgba(255, 255, 255, 0.08);
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
          cursor: pointer;
        }
        .flow-root:hover {
          transform: translateY(-2px);
          box-shadow: 0 16px 35px -5px rgba(11, 15, 25, 0.38), 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .flow-root__title {
          font-family: var(--font-display-short);
          font-weight: 700;
          font-size: 15px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #ffffff;
          margin-bottom: 5px;
        }
        .flow-root__desc {
          font-size: 13.5px;
          color: #94a3b8;
          font-weight: 500;
        }

        /* CONNECTORS */
        .flow-connectors {
          position: relative;
          height: 28px;
          margin: 0 auto;
          max-width: 720px;
        }
        .flow-line-v-top {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 2px;
          height: 14px;
          background: #cbd5e1;
          transition: background 0.3s ease;
        }
        .flow-line-h {
          position: absolute;
          top: 14px;
          left: 25%;
          right: 25%;
          height: 2px;
          background: #cbd5e1;
          transition: background 0.3s ease;
        }
        .flow-line-v-left {
          position: absolute;
          top: 14px;
          left: 25%;
          width: 2px;
          height: 14px;
          background: #cbd5e1;
          transition: background 0.3s ease;
        }
        .flow-line-v-right {
          position: absolute;
          top: 14px;
          right: 25%;
          width: 2px;
          height: 14px;
          background: #cbd5e1;
          transition: background 0.3s ease;
        }

        /* Active highlight for connectors */
        .flow-stage:has(.flow-col--visual:hover) .flow-line-v-top,
        .flow-stage:has(.flow-col--visual:hover) .flow-line-v-left {
          background: #3b82f6;
        }
        .flow-stage:has(.flow-col--visual:hover) .flow-line-h {
          background: linear-gradient(to right, #3b82f6 50%, #cbd5e1 50%);
        }

        .flow-stage:has(.flow-col--intellect:hover) .flow-line-v-top,
        .flow-stage:has(.flow-col--intellect:hover) .flow-line-v-right {
          background: #8b5cf6;
        }
        .flow-stage:has(.flow-col--intellect:hover) .flow-line-h {
          background: linear-gradient(to right, #cbd5e1 50%, #8b5cf6 50%);
        }

        .flow-stage:has(.flow-root:hover) .flow-line-v-top,
        .flow-stage:has(.flow-root:hover) .flow-line-h,
        .flow-stage:has(.flow-root:hover) .flow-line-v-left,
        .flow-stage:has(.flow-root:hover) .flow-line-v-right {
          background: #0b0f19;
        }

        /* GRID COLUMNS */
        .flow-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 32px;
          position: relative;
          z-index: 1;
        }
        .flow-col {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        /* HEADER CARDS */
        .flow-header-card {
          border-radius: 14px;
          padding: 18px 24px;
          text-align: center;
          transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
          cursor: pointer;
        }
        .flow-header-card--visual {
          background: #eff6ff;
          border: 1.5px solid #3b82f6;
        }
        .flow-header-card--visual:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 24px -4px rgba(59, 130, 246, 0.22);
          background: #e8f2ff;
        }
        .flow-header-card--visual .flow-header-title {
          color: #2563eb;
        }

        .flow-header-card--intellect {
          background: #faf5ff;
          border: 1.5px solid #a855f7;
        }
        .flow-header-card--intellect:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 24px -4px rgba(168, 85, 247, 0.22);
          background: #f4ecff;
        }
        .flow-header-card--intellect .flow-header-title {
          color: #7c3aed;
        }

        .flow-header-title {
          font-family: var(--font-display-short);
          font-weight: 700;
          font-size: 15px;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          margin-bottom: 4px;
        }
        .flow-header-desc {
          font-size: 13.5px;
          color: #475569;
          font-weight: 500;
        }

        /* ITEM STACK */
        .flow-stack {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .flow-item {
          background: #ffffff;
          border: 1px solid var(--cl-line);
          border-radius: 12px;
          padding: 15px 20px;
          text-align: center;
          box-shadow: 0 2px 5px rgba(15, 23, 42, 0.02);
          transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
          cursor: pointer;
          position: relative;
          overflow: hidden;
        }
        .flow-item::before {
          content: '';
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 3.5px;
          opacity: 0;
          transition: opacity 0.2s ease;
        }
        .flow-col--visual .flow-item::before {
          background: #2563eb;
        }
        .flow-col--intellect .flow-item::before {
          background: #7c3aed;
        }

        .flow-col--visual .flow-item:hover {
          transform: translateY(-2px);
          border-color: #3b82f6;
          background: #f8faff;
          box-shadow: 0 10px 22px -4px rgba(59, 130, 246, 0.15);
        }
        .flow-col--intellect .flow-item:hover {
          transform: translateY(-2px);
          border-color: #8b5cf6;
          background: #fdfaff;
          box-shadow: 0 10px 22px -4px rgba(139, 92, 246, 0.15);
        }
        .flow-item:hover::before {
          opacity: 1;
        }

        .flow-item__name {
          font-size: 15px;
          font-weight: 600;
          color: #0f172a;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }
        .flow-item__check {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          border: 1.5px solid #cbd5e1;
          font-size: 11px;
          color: transparent;
          transition: all 0.2s ease;
          flex-shrink: 0;
        }
        .flow-item.is-checked {
          background: #f0fdf4 !important;
          border-color: #86efac !important;
        }

<script>
        function toggleFlowCheck(el) {
          el.classList.toggle('is-checked');
          updateFlowStatus();
        }

        function updateFlowStatus() {
          const checked = document.querySelectorAll('.flow-item.is-checked').length;
          const total = document.querySelectorAll('.flow-item').length;
          const textEl = document.getElementById('flowStatusText');
          const resetBtn = document.getElementById('flowResetBtn');

          if (resetBtn) resetBtn.style.display = checked > 0 ? 'inline-block' : 'none';

          if (checked === 0) {
            textEl.textContent = 'Chạm vào từng tiêu chí để kiểm tra tiêu chuẩn video';
          } else if (checked === total) {
            textEl.innerHTML = '🎉 <b style="color: #16a34a;">ĐẠT 6/6 TIÊU CHÍ:</b> Video trọn vẹn Thị Giác & Trí Tuệ, sẵn sàng tích lũy 7 giờ niềm tin!';
          } else {
            textEl.innerHTML = `Đã kiểm tra: <b>${checked}/${total} tiêu chuẩn</b> (${checked < 3 ? 'Cần bổ sung thêm' : 'Đang rất tốt, tiếp tục hoàn thiện!'})`;
          }
        }

        function resetFlowChecks() {
          document.querySelectorAll('.flow-item.is-checked').forEach(el => el.classList.remove('is-checked'));
          updateFlowStatus();
        }

        function toggleBranch(branch) {
          const items = document.querySelectorAll(`.flow-item[data-branch="${branch}"]`);
          const allChecked = Array.from(items).every(el => el.classList.contains('is-checked'));
          items.forEach(el => {
            if (allChecked) {
              el.classList.remove('is-checked');
            } else {
              el.classList.add('is-checked');
            }
          });
          updateFlowStatus();
        }

        function highlightAllFlow() {
          const items = document.querySelectorAll('.flow-item');
          const allChecked = Array.from(items).every(el => el.classList.contains('is-checked'));
          items.forEach(el => {
            if (allChecked) {
              el.classList.remove('is-checked');
            } else {
              el.classList.add('is-checked');
            }
          });
          updateFlowStatus();
        }
      </script>

<script>
        // Tự động mở câu hỏi đầu tiên khi tải trang
        document.querySelectorAll('.faq-item.active').forEach(item => {
          const wrapper = item.querySelector('.faq-answer-wrapper');
          if (wrapper) wrapper.style.maxHeight = wrapper.scrollHeight + "px";
        });

        document.querySelectorAll('.faq-question').forEach(question => {
          question.addEventListener('click', () => {
            const item = question.parentElement;
            const wrapper = item.querySelector('.faq-answer-wrapper');

            document.querySelectorAll('.faq-item').forEach(otherItem => {
              if(otherItem !== item) {
                otherItem.classList.remove('active');
                otherItem.querySelector('.faq-answer-wrapper').style.maxHeight = null;
              }
            });

            if (item.classList.contains('active')) {
              item.classList.remove('active');
              wrapper.style.maxHeight = null;
            } else {
              item.classList.add('active');
              wrapper.style.maxHeight = wrapper.scrollHeight + "px";
            }
          });
        });

        // Responsive: collapse grid on mobile
        if (window.innerWidth < 640) {
          document.querySelectorAll('[style*="grid-template-columns: 1fr 1fr"]').forEach(el => {
            el.style.gridTemplateColumns = '1fr';
          });
        }
      </script>
