<!-- STYLES FROM PAGE 2 (logickenh-xaykenh.html) -->
<style>

    @font-face {
      font-family: 'FD Aeonik Extended';
      src: url('./fonts/FDAeonikExtended-Regular.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonikExtended-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik Extended';
      src: url('./fonts/FDAeonikExtended-Bold.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonikExtended-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FD Integral';
      src: url('./fonts/SVN-IntegralCF-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'FD Integral';
      src: url('./fonts/SVN-IntegralCF-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-Regular.woff2?v=2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-Bold.woff2?v=2') format('woff2');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-Semibold.woff2?v=2') format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text Web';
      src: url('./fonts/FDTiemposText-RegularItalic.woff2?v=2') format('woff2');
      font-weight: 400; font-style: italic; font-display: swap;
    }

    
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonik-Regular.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonik-Regular.ttf') format('truetype'),
           local('FD Aeonik Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonik-Medium.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonik-Medium.ttf') format('truetype'),
           local('FD Aeonik Medium');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonik-Bold.woff2?v=2') format('woff2'),
           url('./fonts/FDAeonik-Bold.ttf') format('truetype'),
           local('FD Aeonik Bold');
      font-weight: 600 700;
      font-style: normal;
      font-display: swap;
    }
    
    
    

    :root {
      --cl-bg: #ffffff;
      --cl-tint: #f8fafc;
      --cl-line: #e2e8f0;
      --cl-text-base: #090d16;
      --cl-text-body: #0f172a;
      --cl-text-muted: #475569;
      --cl-accent: #1a73e8;
      --cl-accent-soft: rgba(26, 115, 232, 0.08);

      --font-display-short: 'FD Aeonik Extended', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display-long: 'FD Aeonik', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Tiempos Text Web', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', Consolas, Monaco, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html {
      background-color: var(--cl-bg);
      color: var(--cl-text-base);
      font-family: var(--font-body);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      line-height: 1.8;
      padding-bottom: 80px;
    }

    /* Top Bar */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--cl-line);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-display-long);
    }
    .top-nav__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--cl-text-base);
    }
    .top-nav__badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      background: var(--cl-text-base);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.08em;
    }
    .top-nav__title {
      font-family: var(--font-display-short); text-transform: uppercase;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .top-nav__links {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .top-nav__link {
      color: var(--cl-text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .top-nav__link:hover {
      color: var(--cl-accent);
    }

    /* Sections */
    .cl-zebra-section {
      width: 100%;
      padding: clamp(48px, 6vw, 84px) 20px;
      border-bottom: 1px solid var(--cl-line);
    }
    .cl-zebra--light { background-color: var(--cl-bg); }
    .cl-zebra--tint { background-color: var(--cl-tint); }

    .cl-sec-container {
      max-width: 820px;
      margin: 0 auto;
    }

    .cl-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cl-accent);
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cl-accent-soft);
      padding: 4px 12px;
      border-radius: 100px;
    }
    .cl-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--cl-accent);
      border-radius: 50%;
    }

    .title-short {
      font-family: var(--font-display-short); text-transform: uppercase;
      font-size: clamp(24px, 3.8vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--cl-text-base);
      margin-bottom: 16px;
      text-wrap: balance;
    }

    .title-long {
      font-family: var(--font-display-long);
      font-size: clamp(20px, 2.8vw, 26px);
      font-weight: 600;
      line-height: 1.35;
      color: var(--cl-text-base);
      margin-bottom: 14px;
    }

    .cl-body {
      font-family: var(--font-body);
      font-size: clamp(16.5px, 1.8vw, 18px);
      line-height: 1.85;
      color: var(--cl-text-body);
      margin-bottom: 20px;
    }

    .editorial-hook {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.65;
      color: var(--cl-text-base);
      border-left: 3px solid var(--cl-accent);
      padding-left: 20px;
      margin: 24px 0;
    }

    /* Cards */
    .apple-card {
      background: #ffffff;
      border: 1px solid var(--cl-line);
      border-radius: 16px;
      padding: clamp(20px, 3vw, 26px);
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(9, 13, 22, 0.03);
    }
    .apple-card__badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cl-accent);
      margin-bottom: 8px;
    }
    .apple-card__title {
      font-family: var(--font-display-long);
      font-size: 18px;
      font-weight: 700;
      color: var(--cl-text-base);
      margin-bottom: 10px;
    }

    .quote-box {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 16px 20px;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--cl-text-body);
      line-height: 1.7;
      margin: 14px 0;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }
    @media (max-width: 640px) {
      .comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    .compare-card {
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--cl-line);
    }
    .compare-card--wrong {
      background: #fffdfd;
      border-color: #fecaca;
    }
    .compare-card--right {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .compare-card__tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .compare-card--wrong .compare-card__tag { color: #dc2626; }
    .compare-card--right .compare-card__tag { color: #16a34a; }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cl-text-base);
      color: #ffffff;
      text-decoration: none;
      font-family: var(--font-display-long);
      font-size: 14.5px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      transition: opacity 0.2s;
      margin-top: 10px;
    }
    .btn-action:hover {
      opacity: 0.9;
    }

    .highlight-rule {
      background: #eff6ff;
      border-left: 4px solid var(--cl-accent);
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin: 20px 0;
      font-size: 16px;
    }

    /* FAQ UI UX UPGRADES */
    .faq-item {
      background: var(--cl-card);
      border-radius: 0 var(--cl-radius-lg) var(--cl-radius-lg) 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      margin-bottom: 24px;
      padding: 24px 32px;
      width: 100%;
      max-width: 840px;
      text-align: left;
      transition: box-shadow 0.3s ease, transform 0.3s var(--apple-spring);
    }
    .faq-item:hover {
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      transform: translateX(4px);
    }
    .faq-question {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 20px;
    }
    .faq-number {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--cl-text-muted);
      flex-shrink: 0;
    }
    .faq-question .title-short {
      margin-bottom: 0;
      font-size: clamp(18px, 2.5vw, 24px);
      flex-grow: 1;
      text-transform: none; /* FAQ titles should be readable */
      font-family: var(--font-display-long);
      letter-spacing: -0.01em;
    }
    .faq-icon {
      font-size: 18px;
      font-weight: 700;
      color: var(--cl-text-muted);
      transition: transform 0.3s var(--apple-spring), color 0.2s ease;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      background: var(--cl-tint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .faq-item.is-active .faq-icon {
      transform: rotate(180deg);
      background: var(--cl-accent);
      color: white;
    }
    .faq-answer-wrapper {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px dashed var(--cl-line);
    }
    .faq-conclusion {
      font-weight: 600;
      color: var(--cl-text-base);
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.6;
    }


    /* UI UX ITERATION 2: TABLE & GRID UPGRADES */
    .apple-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 16px;
      margin-bottom: 16px;
      border-radius: var(--cl-radius-sm);
      overflow: hidden;
      border: 1px solid var(--cl-line);
    }
    .apple-table th {
      background: var(--cl-tint);
      font-family: var(--font-display-long);
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--cl-line-strong);
      font-size: 15px;
    }
    .apple-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--cl-line);
      font-size: 15.5px;
      line-height: 1.5;
    }
    .apple-table tr:last-child td {
      border-bottom: none;
    }
    .apple-table tr:nth-child(even) {
      background-color: #fafafa;
    }
    
    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 24px;
      margin-bottom: 24px;
    }
    .compare-card {
      background: var(--cl-card);
      border-radius: var(--cl-radius-lg);
      padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      position: relative;
      border-top: 6px solid var(--cl-line);
    }
    .compare-card--wrong { border-top-color: var(--cl-danger); }
    .compare-card--right { border-top-color: var(--cl-success); }
    .compare-card__tag {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }
    .compare-card--wrong .compare-card__tag { color: var(--cl-danger); }
    .compare-card--right .compare-card__tag { color: var(--cl-success); }


    /* UI UX ITERATION 3 & 4: SPACING & LIST ALIGNMENT */
    .cl-sec-container[style*="border-left"] {
      padding-left: 32px !important;
      text-align: left !important;
      max-width: 800px;
    }
    
    @media (max-width: 768px) {
      .cl-sec-container[style*="border-left"] {
        padding-left: 20px !important;
      }
    }

    .cl-body ul, .cl-body ol {
      padding-left: 24px;
      margin-bottom: 24px;
    }
    
    .cl-body li {
      margin-bottom: 12px;
      line-height: 1.65;
    }


    /* UI UX ITERATION 5: HANGING INDENT & CARD TITLES */
    .apple-card__title {
      font-size: 20px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--cl-line);
      color: var(--cl-text-base);
    }
    .apple-card ul {
      list-style: none;
      padding-left: 0;
      margin-bottom: 0;
    }
    .apple-card ul li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 16px;
    }
    .apple-card ul li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--cl-accent);
      font-weight: bold;
    }
    .apple-card[style*="border-left"] {
      border-left: none !important; /* Xóa viền lồng viền */
      box-shadow: 0 4px 24px rgba(245, 158, 11, 0.1); /* Dùng shadow màu cam thay vì border gắt */
    }

  
    /* ═══ CLEAN STICKY NAV ═══ */
    .sticky-nav {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 6px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      max-width: min(calc(100vw - 28px), 760px);
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .sticky-nav::-webkit-scrollbar { display: none; }
    .nav-dropdown-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #1a73e8;
      background: rgba(26, 115, 232, 0.08);
      border: 1px solid rgba(26, 115, 232, 0.25);
      padding: 5px 12px;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .nav-dropdown-btn:hover {
      background: #1a73e8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.28);
    }

</style>

<!-- SCRIPTS FROM PAGE 2 -->
<script>
    document.querySelectorAll('.faq-question').forEach(function(question) {
        question.addEventListener('click', function() {
            var wrapper = this.nextElementSibling;
            var icon = this.querySelector('.faq-icon');
            if (wrapper.style.display === 'none' || wrapper.style.display === '') {
                wrapper.style.display = 'block';
                icon.textContent = '−';
            } else {
                wrapper.style.display = 'none';
                icon.textContent = '+';
            }
        });
    });
</script>
