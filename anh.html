      <style>
    /* ═══ 1. FONT DECLARATIONS ═══ */
    @font-face {
      font-family: 'FD Anguita Sans';
      src: url('https://font.fedu.vn/fonts/FDAnguitaSans-Black.woff2') format('woff2'),
           url('/Users/vietmac/Library/Fonts/FDAnguitaSans-Black.ttf') format('truetype'),
           local('FD Anguita Sans Black'), local('FDAnguitaSans-Black');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Anguita Sans';
      src: url('https://font.fedu.vn/fonts/FDAnguitaSans-Bold.woff2') format('woff2'),
           url('/Users/vietmac/Library/Fonts/FDAnguitaSans-Bold.ttf') format('truetype'),
           local('FD Anguita Sans Bold'), local('FDAnguitaSans-Bold');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik Extended'; text-transform: uppercase;
      src: url('https://font.fedu.vn/fonts/FDAeonikExtended-Bold.woff2?v=20260911b') format('woff2'),
           url('./fonts/FDAeonikExtended-Bold.woff2') format('woff2'),
           local('FD Aeonik Extended Bold');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('./fonts/FDAeonikRegular.ttf') format('truetype'),
           local('FD Aeonik Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('https://font.fedu.vn/fonts/FDAeonikExtended-SemiBold.woff2?v=20260911b') format('woff2'),
           url('./fonts/FDAeonikExtended-SemiBold.woff2') format('woff2'),
           local('FD Aeonik SemiBold');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('/Users/vietmac/Library/Fonts/FDTiemposText-Regular.otf') format('opentype'),
           local('Tiempos Text Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('/Users/vietmac/Library/Fonts/FDTiemposText-Medium.otf') format('opentype'),
           local('Tiempos Text Medium');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    /* ═══ 2. SWISS DARK ARCHITECTURE TOKENS ═══ */
    :root {
      --cl-bg:          #07090e;
      --cl-tint:        #0c101a;
      --cl-card:        #111622;
      --cl-card-muted:  #161d2d;
      --cl-accent:      #38bdf8;
      --cl-accent-tint: rgba(56, 189, 248, 0.12);
      --cl-line:        rgba(255, 255, 255, 0.08);
      --cl-line-strong: rgba(255, 255, 255, 0.18);
      --cl-text-base:   #f8fafc;
      --cl-text-muted:  #94a3b8;
      --cl-text-faint:  #64748b;
      --cl-radius-sm:   10px;
      --cl-radius-md:   16px;
      --cl-radius-lg:   24px;
      --cl-font-head:   'FD Aeonik Extended', -apple-system, BlinkMacSystemFont, sans-serif;
      --cl-font-sub:    'FD Aeonik', -apple-system, BlinkMacSystemFont, sans-serif;
      --cl-font-serif:  'Tiempos Text', Georgia, serif;
      --cl-font-mono:   'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background-color: var(--cl-bg);
      color: var(--cl-text-base);
      font-family: var(--cl-font-sub);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .cl-block {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(60px, 8vh, 100px) clamp(20px, 5vw, 64px);
      position: relative;
    }
    .cl-zebra--dark-0 { background-color: var(--cl-bg); }
    .cl-zebra--dark-1 { background-color: var(--cl-tint); border-top: 1px solid var(--cl-line); border-bottom: 1px solid var(--cl-line); }

    .cl-container {
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
    }

    .cl-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--cl-card-muted);
      border: 1px solid var(--cl-line-strong);
      color: var(--cl-accent);
      font-family: var(--cl-font-mono);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .cl-title {
      font-family: var(--cl-font-head);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      font-size: clamp(28px, 4vw, 50px);
      line-height: 1.08;
      color: #ffffff;
      text-wrap: balance;
      margin-bottom: 16px;
    }
    .cl-desc {
      font-family: var(--cl-font-serif);
      font-size: clamp(16px, 1.25vw, 18.5px);
      color: var(--cl-text-muted);
      max-width: 840px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .cl-card {
      background: var(--cl-card);
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-md);
      transition: all 0.22s cubic-bezier(0.25, 1, 0.35, 1.05);
    }
    .cl-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Icon Tile */
    .icon-tile {
      width: 100%;
      aspect-ratio: 1;
      background: #131722;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.35, 1.05);
      color: #ffffff;
      padding: 10px;
    }
    .icon-tile:hover {
      background: #1a2233;
      border-color: var(--cl-accent);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }
    .icon-tile svg {
      width: 32px;
      height: 32px;
      color: #ffffff;
      transition: transform 0.2s ease;
    }
    .icon-tile:hover svg {
      transform: scale(1.1);
    }
    .icon-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--cl-text-muted);
      margin-top: 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }
    .icon-tile:hover .icon-name {
      color: #ffffff;
    }

    /* Subdomain Favicon Card */
    .fav-card {
      background: var(--cl-card);
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.2s ease;
    }
    .fav-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5);
    }
    .fav-display-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .fav-hires {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }
    .fav-16preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #ffffff;
      color: #07090e;
    }
    .btn-primary:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }
    .btn-accent {
      background: #38bdf8;
      color: #07090e;
    }
    .btn-accent:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }
    .btn-subtle {
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      border-color: var(--cl-line);
    }
    .btn-subtle:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--cl-line-strong);
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--cl-line);
      color: var(--cl-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #ffffff;
      color: #07090e;
      border-color: #ffffff;
    }

    /* Browser Tab Simulator (Thanh Tab Chrome 1:1) */
    .tab-bar-sim {
      background: #1e222b;
      border-radius: 16px;
      padding: 10px 14px 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .chrome-tab {
      height: 38px;
      padding: 0 14px;
      border-radius: 10px 10px 0 0;
      background: #11141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: none;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12.5px;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      min-width: 140px;
      max-width: 220px;
    }
    .chrome-tab.active {
      background: #07090e;
      color: #ffffff;
      font-weight: 600;
      border-color: rgba(255, 255, 255, 0.18);
    }
    .chrome-tab:hover {
      background: #181d28;
      color: #f1f5f9;
    }
    .chrome-tab img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #ffffff;
      color: #07090e;
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.35, 1.05);
      z-index: 99999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--cl-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 48px);
      z-index: 1000;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
      font-family: var(--cl-font-head);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }
    .nav-links a {
      color: var(--cl-text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .nav-links a:hover { color: #ffffff; }

    .optical-box {
      background: #0f1422;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--cl-radius-md);
      padding: 24px;
    }
  
    /* --- GMAIL CSS --- */
    .acc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .acc-card {
      background: var(--cl-card);
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.22s ease;
      position: relative;
    }
    .acc-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .acc-card.inactive {
      opacity: 0.6;
      border-style: dashed;
    }
    .acc-card.inactive:hover {
      opacity: 0.9;
    }

    .acc-head {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .logo-frame {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #07090e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .logo-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .acc-info {
      flex: 1;
      overflow: hidden;
    }
    .acc-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .acc-title {
      font-family: var(--cl-font-mono);
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .code-badge {
      font-family: var(--cl-font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid;
      flex-shrink: 0;
    }
    .acc-desc-text {
      font-size: 12px;
      color: var(--cl-text-muted);
      margin-top: 3px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Previews row 16px, 24px, 32px */
    .preview-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .prev-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--cl-text-muted);
      font-family: var(--cl-font-mono);
    }
    .prev-item img {
      border-radius: 4px;
      display: block;
    }

    /* Pass & Note box */
    .note-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pass-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pass-val {
      font-family: var(--cl-font-mono);
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.05em;
    }
    .pass-masked {
      filter: blur(4px);
      user-select: none;
      transition: filter 0.2s ease;
    }
    .show-passwords .pass-masked {
      filter: none;
      user-select: auto;
    }

    /* Card Action buttons */
    .card-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .card-btns .btn-full {
      grid-column: 1 / -1;
    }
    .btn-sm {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      justify-content: center;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #ffffff;
      color: #07090e;
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.35, 1.05);
      z-index: 99999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  
  </style>

    
    <style>
        body { background-color: var(--cl-bg); color: var(--cl-text-base); font-family: var(--cl-font-sub); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .gallery-header { position: sticky; top: 0; z-index: 100; background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--cl-line); padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header-left h1 { font-family: var(--cl-font-head); font-size: 28px; font-weight: 700; letter-spacing: 1px; margin: 0 0 4px 0; color: var(--cl-text-base); }
        .header-left p { font-family: var(--cl-font-mono); font-size: 13px; color: var(--cl-accent); margin: 0; }
        .toolbar { padding: 24px 40px 0 40px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select { background: var(--cl-card); border: 1px solid var(--cl-line-strong); color: var(--cl-text-base); padding: 12px 20px; border-radius: var(--cl-radius-sm); font-family: var(--cl-font-sub); font-size: 14px; outline: none; transition: all 0.2s ease; }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--cl-accent); box-shadow: 0 0 0 3px var(--cl-accent-tint); }
        .toolbar input { flex-grow: 1; min-width: 300px; }
        .stats { padding: 20px 40px 0 40px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .stat-badge { background: var(--cl-card-muted); border: 1px solid var(--cl-line); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-family: var(--cl-font-mono); color: var(--cl-text-muted); }
        .style-a .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 32px 40px 60px 40px; }
        .style-b .grid-container { columns: 4 300px; column-gap: 24px; padding: 32px 40px 60px 40px; }
        .poster-card { background: var(--cl-card); border: 1px solid var(--cl-line); border-radius: var(--cl-radius-md); overflow: hidden; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; position: relative; margin-bottom: 24px; break-inside: avoid; }
        .poster-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.4); border-color: var(--cl-line-strong); }
        .poster-img-wrap { position: relative; width: 100%; overflow: hidden; }
        .poster-img-wrap img { width: 100%; height: auto; display: block; cursor: zoom-in; transition: transform 0.5s ease; }
        .poster-card:hover .poster-img-wrap img { transform: scale(1.03); }
        .copy-btn { position: absolute; bottom: 12px; right: 12px; background: rgba(7, 9, 14, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 12px; border-radius: 8px; font-family: var(--cl-font-sub); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: 0; transform: translateY(10px); transition: all 0.2s ease; }
        .poster-card:hover .copy-btn { opacity: 1; transform: translateY(0); }
        .copy-btn:hover { background: var(--cl-accent); color: #07090e; }
        .poster-info { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .poster-id { font-family: var(--cl-font-mono); font-size: 11px; color: var(--cl-accent); background: var(--cl-accent-tint); padding: 4px 8px; border-radius: 4px; display: inline-block; align-self: flex-start; }
        .poster-title { font-family: var(--cl-font-head); font-size: 16px; font-weight: 700; line-height: 1.4; color: var(--cl-text-base); text-transform: uppercase; }
        .poster-poem { font-family: var(--cl-font-serif); font-size: 14px; line-height: 1.6; color: var(--cl-text-muted); font-style: italic; }
        .poster-meta { font-family: var(--cl-font-mono); font-size: 11px; color: var(--cl-text-faint); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 9999; align-items: center; justify-content: center; }
        .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
        .btn-toggle { background: var(--cl-card); border: 1px solid var(--cl-line); color: var(--cl-text-base); padding: 8px 16px; border-radius: var(--cl-radius-sm); font-family: var(--cl-font-sub); font-size: 13px; cursor: pointer; transition: 0.2s; }
        .btn-toggle.active { background: var(--cl-accent); color: var(--cl-bg); border-color: var(--cl-accent); font-weight: 600; }
        .just-image-label { position: absolute; top: 12px; left: 12px; font-family: var(--cl-font-mono); font-size: 11px; color: #fff; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body class="style-b">
    <header class="gallery-header">
        <div class="header-left">
            <h1>THƯ VIỆN POSTER</h1>
            <p id="total-count">LOADING DATA...</p>
        </div>
        <div class="header-right" style="display:flex; gap:12px;">
            <button class="btn-toggle" data-style="style-a" onclick="setStyle('style-a')">GRID VIEW</button>
            <button class="btn-toggle active" data-style="style-b" onclick="setStyle('style-b')">MASONRY VIEW</button>
        </div>
    </header>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo mã, tiêu đề, thơ, thẻ loại, phong cách...">
        <select id="categoryFilter">
            <option value="all">Tất cả thể loại</option>
            <option value="Chưa phân loại">Chưa phân loại</option>
            <option value="Phim Điện Ảnh">Phim Điện Ảnh</option>
            <option value="Anime">Anime</option>
            <option value="Game">Game</option>
        </select>
        <select id="styleFilter">
            <option value="all">Tất cả phong cách</option>
            <option value="Google Flow">Google Flow</option>
            <option value="Chưa phân loại">Chưa phân loại</option>
            <option value="Cinematic">Cinematic</option>
            <option value="Anime Style">Anime Style</option>
            <option value="3D Render">3D Render</option>
        </select>
    </div>
    <div id="statsContainer" class="stats"></div>
    <div id="grid" class="grid-container"></div>
    <div id="lightbox" onclick="closeLightbox(event)">
        <img id="lightbox-img" src="" alt="Zoomed Poster">
    </div>

    <script>
        let allPosters = [];

        async function init() {
            try {
                const res = await fetch('database.json');
                const data = await res.json();
                allPosters = data.posters;
                document.getElementById('total-count').textContent = `[ ${data.metadata.total_images} MASTERPIECES ]`;
                renderCards(allPosters);
                renderStats(allPosters);
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('grid').innerHTML = '<p style="padding:16px; color:#ef4444;">Lỗi tải dữ liệu. Cần chạy trên Live Server (localhost) do CORS.</p>';
            }
        }

        function copyPrompt(btn) {
            const text = btn.dataset.prompt;
            navigator.clipboard.writeText(text).then(() => {
                const span = btn.querySelector('span');
                span.textContent = 'COPIED!';
                btn.style.background = 'var(--cl-accent)';
                btn.style.color = 'var(--cl-bg)';
                setTimeout(() => { 
                    span.textContent = 'COPY PROMPT'; 
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            });
        }

        function renderCards(posters) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            posters.forEach(p => {
                const card = document.createElement('div');
                card.className = 'poster-card';
                let html = `<div class="poster-img-wrap"><img src="${p.image}" loading="lazy" alt="Poster" onclick="openLightbox('${p.image}')">`;
                
                if (p.has_prompt) {
                    const safePrompt = (p.prompt || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    html += `<button class="copy-btn" data-prompt="${safePrompt}" onclick="copyPrompt(this)">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> 
                          <span>COPY PROMPT</span>
                        </button>`;
                } else {
                    html += `<div class="just-image-label">${p.id}</div>`;
                }
                
                html += `</div>`;
                
                if (p.has_prompt) {
                    html += `<div class="poster-info">
                        <div class="poster-id">${p.id}</div>
                        <div class="poster-title">${p.title}</div>
                        <div class="poster-poem">${(p.poem || '').replace(/\n/g, '<br>')}</div>
                        <div class="poster-meta">
                            <span>${p.movie_reference || 'N/A'}</span> • 
                            <span>${p.category || 'N/A'}</span> • 
                            <span>${p.style || 'N/A'}</span>
                        </div>
                      </div>`;
                }
                card.innerHTML = html;
                grid.appendChild(card);
            });
        }

        function renderStats(posters) {
            const stats = document.getElementById('statsContainer');
            const counts = {};
            posters.forEach(p => {
                const k = p.movie_reference || 'Khác';
                counts[k] = (counts[k] || 0) + 1;
            });
            
            let html = '<strong style="color: var(--cl-text-base); font-family: var(--cl-font-head); font-size: 13px;">THỐNG KÊ:</strong> ';
            for (const [k, v] of Object.entries(counts)) {
                html += `<span class="stat-badge">${k}: ${v}</span>`;
            }
            stats.innerHTML = html;
        }

        function removeAccents(str) {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function filterData() {
            const rawSearch = document.getElementById('searchInput').value;
            const search = removeAccents(rawSearch).trim();
            const category = document.getElementById('categoryFilter').value;
            const style = document.getElementById('styleFilter').value;
            
            let synonyms = [search];
            if (search.includes('tuong') || search.includes('lien minh') || search.includes('lol')) {
                synonyms.push('league of legends');
                synonyms.push('champion');
            }
            if (search.includes('flow')) {
                synonyms.push('google flow');
            }

            const filtered = allPosters.filter(p => {
                const fullText = removeAccents([
                    p.title, p.poem, p.id, p.prompt, p.category, p.style, p.movie_reference
                ].filter(Boolean).join(' '));
                
                const matchSearch = search === '' || synonyms.some(syn => fullText.includes(syn));
                const matchCategory = category === 'all' || p.category === category;
                const matchStyle = style === 'all' || p.style === style;
                
                return matchSearch && matchCategory && matchStyle;
            });

            renderCards(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('categoryFilter').addEventListener('change', filterData);
        document.getElementById('styleFilter').addEventListener('change', filterData);

        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.style.display = 'flex';
        }
        
        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                document.getElementById('lightbox').style.display = 'none';
            }
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('lightbox').style.display = 'none';
            }
        });

        function setStyle(s) { 
            document.body.className = s; 
            localStorage.setItem('poster_style', s); 
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.toggle('active', b.dataset.style === s)); 
        }
        
        document.addEventListener('DOMContentLoaded', () => { 
            const s = localStorage.getItem('poster_style') || 'style-b'; 
            setStyle(s); 
        });

        init();
    </script>
</body>
</html>
