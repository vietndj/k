<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title} • Tập Hồ Sơ</title>
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%2307090E'/%3E%3Cpath%20d='M13.4%2053Q12.3%2053%2012.3%2051.9V21.3H9.1Q8%2021.3%208%2020.2V15.1Q8%2014%209.1%2014H24.3Q25.4%2014%2025.4%2015.1V20.2Q25.4%2021.3%2024.3%2021.3H21V51.9Q21%2053%2020%2053ZM32.5%2053Q31.5%2053%2031.5%2051.9V21.3H28.2Q27.1%2021.3%2027.1%2020.2V15.1Q27.1%2014%2028.2%2014H43.4Q44.5%2014%2044.5%2015.1V20.2Q44.5%2021.3%2043.4%2021.3H40.2V51.9Q40.2%2053%2039.1%2053Z'%20fill='%2338BDF8'/%3E%3Ccircle%20cx='52'%20cy='13'%20r='4.2'%20fill='%2338BDF8'/%3E%3C/svg%3E">
    <!-- Gắn file CSS chuẩn (Single Source of Truth) -->
    <link rel="stylesheet" href="./css/tap_ho_so.css">
</head>
<body>
    <!-- BẢO MẬT PIN SHA-256 -->
    <div id="gatekeeper">
        <div class="gk-title">NHẬP MÃ PIN ĐỂ TRUY CẬP</div>
        <input type="password" id="pin-input" class="gk-input" maxlength="4" placeholder="••••" autofocus>
        <div id="gk-error" style="color: red; margin-top: 10px; opacity: 0; font-size: 14px;">Mã PIN không đúng</div>
    </div>

    <!-- DUAL-TRACK LAYOUT -->
    <div class="layout-wrapper" id="main-layout">
        <!-- CỘT 1: STICKY SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-title">MỤC LỤC TẬP HỒ SƠ</div>
            <ul class="toc-list" id="toc">
                {toc_html}
            </ul>
        </aside>
        
        <!-- CỘT 2: ĐỌC CHUYÊN SÂU -->
        <main class="canvas">
            <h1 class="title-hero">{title}</h1>
            {content_html}
        </main>
    </div>

    <!-- HỆ THỐNG LOGIC LÕI -->
    <script>
        // 1. Gatekeeper Logic (Bảo mật SHA-256)
        const input = document.getElementById('pin-input');
        const gatekeeper = document.getElementById('gatekeeper');
        const layout = document.getElementById('main-layout');
        const errorMsg = document.getElementById('gk-error');
        
        if (localStorage.getItem('fedu_vault_auth_v1') === 'ok') {
            gatekeeper.style.display = 'none';
            layout.classList.add('auth-ok');
        }

        const PASSCODE_HASH = '71ffe84afd528a0365d6ec95c89a64cd6979b4a15730649feddf2dc390db9e3c';
        const PASSCODE_HASH_ALT = '967824a58fb12d9b859a4a3a5eb52b1615ba62c8429fe697994919e96bf163f2';
        async function sha256Hex(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        input.addEventListener('input', async (e) => {
            const val = e.target.value;
            if (val.length === 4) {
                const hash = await sha256Hex(val);
                if (hash === PASSCODE_HASH || hash === PASSCODE_HASH_ALT) {
                    localStorage.setItem('fedu_vault_auth_v1', 'ok');
                    gatekeeper.style.opacity = '0';
                    setTimeout(() => {
                        gatekeeper.style.display = 'none';
                        layout.classList.add('auth-ok');
                    }, 300);
                } else {
                    errorMsg.style.opacity = '1';
                    setTimeout(() => { errorMsg.style.opacity = '0'; e.target.value = ''; }, 1000);
                }
            }
        });

        // 2. Scrollspy Logic (Bắt dính mục lục khi cuộn)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.toc-list a').forEach(a => a.classList.remove('active'));
                    const activeLink = document.querySelector(`.toc-list a[href="#${entry.target.id}"]`);
                    if (activeLink) activeLink.classList.add('active');
                }
            });
        }, { rootMargin: "-20% 0px -70% 0px" });

        document.querySelectorAll('h2, h3').forEach(section => observer.observe(section));
    </script>
</body>
</html>
