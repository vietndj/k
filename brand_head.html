  <style>
    /* ═══ 1. FONT DECLARATIONS ═══ */
    @font-face {
      font-family: 'FD Anguita Sans';
      src: url('https://font.fedu.vn/fonts/FDAnguitaSans-Black.woff2') format('woff2'),

    @font-face {
      font-family: 'FD Anguita Sans';
      src: url('https://font.fedu.vn/fonts/FDAnguitaSans-Bold.woff2') format('woff2'),

           local('FD Anguita Sans Bold'), local('FDAnguitaSans-Bold');
      font-weight: 700;

    }
    @font-face {
      font-family: 'FD Aeonik Extended'; text-transform: uppercase;
      src: url('https://font.fedu.vn/fonts/FDAeonikExtended-Bold.woff2?v=20260911b') format('woff2'),

    @font-face {

           local('FD Aeonik Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FD Aeonik';
      src: url('https://font.fedu.vn/fonts/FDAeonikExtended-SemiBold.woff2?v=20260911b') format('woff2'),
           url('./fonts/FDAeonikExtended-SemiBold.woff2') format('woff2'),
           local('FD Aeonik SemiBold');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('/Users/vietmac/Library/Fonts/FDTiemposText-Regular.otf') format('opentype'),
           local('Tiempos Text Regular');
      font-weight: 400;

    }
    @font-face {
      font-family: 'Tiempos Text';
      src: url('/Users/vietmac/Library/Fonts/FDTiemposText-Medium.otf') format('opentype'),
           local('Tiempos Text Medium');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    /* ═══ 2. SWISS DARK ARCHITECTURE TOKENS ═══ */
    :root {
      --cl-bg:          #07090e;
      --cl-tint:        #0c101a;
      --cl-card:        #111622;
      --cl-card-muted:  #161d2d;
      --cl-accent:      #38bdf8;
      --cl-accent-tint: rgba(56, 189, 248, 0.12);
      --cl-line:        rgba(255, 255, 255, 0.08);
      --cl-line-strong: rgba(255, 255, 255, 0.18);
      --cl-text-base:   #f8fafc;
      --cl-text-muted:  #94a3b8;
      --cl-text-faint:  #64748b;
      --cl-radius-sm:   10px;
      --cl-radius-md:   16px;
      --cl-radius-lg:   24px;
      --cl-font-head:   'FD Aeonik Extended', -apple-system, BlinkMacSystemFont, sans-serif;
      --cl-font-sub:    'FD Aeonik', -apple-system, BlinkMacSystemFont, sans-serif;
      --cl-font-serif:  'Tiempos Text', Georgia, serif;
      --cl-font-mono:   'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background-color: var(--cl-bg);
      color: var(--cl-text-base);
      font-family: var(--cl-font-sub);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .cl-block {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(60px, 8vh, 100px) clamp(20px, 5vw, 64px);
      position: relative;
    }
    .cl-zebra--dark-0 { background-color: var(--cl-bg); }
    .cl-zebra--dark-1 { background-color: var(--cl-tint); border-top: 1px solid var(--cl-line); border-bottom: 1px solid var(--cl-line); }

    .cl-container {
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
    }

    .cl-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--cl-card-muted);
      border: 1px solid var(--cl-line-strong);
      color: var(--cl-accent);
      font-family: var(--cl-font-mono);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .cl-title {
      font-family: var(--cl-font-head);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      font-size: clamp(28px, 4vw, 50px);
      line-height: 1.08;
      color: #ffffff;
      text-wrap: balance;
      margin-bottom: 16px;
    }
    .cl-desc {
      font-family: var(--cl-font-serif);
      font-size: clamp(16px, 1.25vw, 18.5px);
      color: var(--cl-text-muted);
      max-width: 840px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .cl-card {
      background: var(--cl-card);
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-md);
      transition: all 0.22s cubic-bezier(0.25, 1, 0.35, 1.05);
    }
    .cl-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Icon Tile */
    .icon-tile {
      width: 100%;
      aspect-ratio: 1;
      background: #131722;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.35, 1.05);
      color: #ffffff;
      padding: 10px;
    }
    .icon-tile:hover {
      background: #1a2233;
      border-color: var(--cl-accent);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }
    .icon-tile svg {
      width: 32px;
      height: 32px;
      color: #ffffff;
      transition: transform 0.2s ease;
    }
    .icon-tile:hover svg {
      transform: scale(1.1);
    }
    .icon-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--cl-text-muted);
      margin-top: 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }
    .icon-tile:hover .icon-name {
      color: #ffffff;
    }

    /* Subdomain Favicon Card */
    .fav-card {
      background: var(--cl-card);
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.2s ease;
    }
    .fav-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5);
    }
    .fav-display-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .fav-hires {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }
    .fav-16preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #ffffff;
      color: #07090e;
    }
    .btn-primary:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }
    .btn-accent {
      background: #38bdf8;
      color: #07090e;
    }
    .btn-accent:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }
    .btn-subtle {
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      border-color: var(--cl-line);
    }
    .btn-subtle:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--cl-line-strong);
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--cl-line);
      color: var(--cl-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #ffffff;
      color: #07090e;
      border-color: #ffffff;
    }

    /* Browser Tab Simulator (Thanh Tab Chrome 1:1) */
    .tab-bar-sim {
      background: #1e222b;
      border-radius: 16px;
      padding: 10px 14px 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .chrome-tab {
      height: 38px;
      padding: 0 14px;
      border-radius: 10px 10px 0 0;
      background: #11141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: none;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12.5px;
      color: #94a3b8;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      min-width: 140px;
      max-width: 220px;
    }
    .chrome-tab.active {
      background: #07090e;
      color: #ffffff;
      font-weight: 600;
      border-color: rgba(255, 255, 255, 0.18);
    }
    .chrome-tab:hover {
      background: #181d28;
      color: #f1f5f9;
    }
    .chrome-tab img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #ffffff;
      color: #07090e;
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.35, 1.05);
      z-index: 99999;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--cl-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 48px);
      z-index: 1000;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
      font-family: var(--cl-font-head);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }
    .nav-links a {
      color: var(--cl-text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .nav-links a:hover { color: #ffffff; }

    .optical-box {
      background: #0f1422;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--cl-radius-md);
      padding: 24px;
    }
  
    /* --- GMAIL CSS --- */
    .acc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .acc-card {
      background: var(--cl-card);
      border: 1px solid var(--cl-line);
      border-radius: var(--cl-radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.22s ease;
      position: relative;
    }
    .acc-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .acc-card.inactive {
      opacity: 0.6;
      border-style: dashed;
    }
    .acc-card.inactive:hover {
      opacity: 0.9;
    }

    .acc-head {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .logo-frame {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #07090e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .logo-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .acc-info {
      flex: 1;
      overflow: hidden;
    }
    .acc-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .acc-title {
      font-family: var(--cl-font-mono);
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .code-badge {
      font-family: var(--cl-font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid;
      flex-shrink: 0;
    }
    .acc-desc-text {
      font-size: 12px;
      color: var(--cl-text-muted);
