<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: "HeadMain";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDMartinaPlantijn-Bold.woff2");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "HeadFocal";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDMartinaPlantijn-BoldItalic.woff2");
    font-weight: 700;
    font-style: italic;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDSohne-Halbfett.woff2");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDSohne-Dreiviertelfett.woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "MetaMono";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDAeonikMono-Bold.woff2");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 40px; top: 135px; width: 570px; height: 1090px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadMain", serif;
    font-size: 86px;
    line-height: 1.08;
    letter-spacing: -0.010em;
    color: #FFFFFF;
    margin-bottom: 50px;
    text-shadow: 0 14px 36px rgba(0, 0, 0, 0.72);
  }
  .headline .line {
    display: block;
    width: max-content;
    white-space: nowrap;
    font-size: 1em;
  }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1em;
    color: #FACC15;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.82);
  }

  .sub-box {
    width: 536px;
    max-width: 536px;
    background: rgba(5, 9, 18, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 44px;
    box-shadow: 0 22px 48px rgba(0, 0, 0, 0.48);
    font-family: "SubMed", sans-serif;
    color: #F8FAFC;
  }
  .mono, .num-tag {
    font-family: "MetaMono", monospace;
    letter-spacing: -0.02em;
  }
  .gold { color: #FACC15 !important; font-family: "SubBold", sans-serif; }
  .div-line { height: 1px; background: rgba(255, 255, 255, 0.11); width: 100%; margin: 13px 0; }

  /* K01 */
  .row-old { font-size: 24px; color: #94A3B8; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .row-old .ic-bad { color: #F87171; font-family: "SubBold", sans-serif; font-size: 26px; }
  .row-new { font-family: "SubBold", sans-serif; font-size: 25px; color: #FFFFFF; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .row-new .ic-good { color: #FACC15; font-size: 27px; }
  .num-tag { background: rgba(148,163,184,0.16); padding: 2px 7px; border-radius: 6px; font-size: 20px; color: #CBD5E1; }
  .num-tag.gold { background: rgba(250,204,21,0.18); border: 1px solid rgba(250,204,21,0.45); color: #FACC15; font-family: "MetaMono", monospace; }

  /* K18 Equation */
  .eq-row { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; white-space: nowrap; }
  .eq-pill { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); padding: 5px 10px; border-radius: 8px; font-size: 21.5px; font-family: "SubBold", sans-serif; }
  .eq-op { color: #FACC15; font-family: "MetaMono", monospace; font-size: 23px; font-weight: 700; }
  .eq-res { color: #FACC15; font-family: "SubBold", sans-serif; font-size: 22.5px; }
  .eq-sub { font-size: 20.5px; color: #CBD5E1; white-space: nowrap; }

  /* K06, K14, K20, K05 Rows */
  .def-row { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 23.5px; }
  .def-row.old { color: #94A3B8; font-size: 23px; }
  .def-row.new { color: #FFFFFF; font-family: "SubBold", sans-serif; font-size: 24px; }
  .badge-muted { font-family: "MetaMono", monospace; font-size: 16px; color: #94A3B8; background: rgba(148,163,184,0.15); border: 1px solid rgba(148,163,184,0.3); padding: 2px 8px; border-radius: 6px; }
  .badge-gold { font-family: "MetaMono", monospace; font-size: 16px; color: #070B14; background: #FACC15; padding: 2px 8px; border-radius: 6px; font-weight: 800; }

  /* K09 Chat */
  .chat-head { display: flex; align-items: center; gap: 8px; font-size: 18px; color: #94A3B8; margin-bottom: 9px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #22C55E; }
  .chat-msg { font-family: "SubBold", sans-serif; font-size: 25px; line-height: 1.32; color: #FFFFFF; }

  /* K03 & K21 Big Metric */
  .box-k03, .box-k21 { display: flex; align-items: center; gap: 14px; }
  .big-metric { font-size: 62px; color: #FACC15; background: rgba(250,204,21,0.12); border: 1.5px solid rgba(250,204,21,0.40); padding: 6px 12px; border-radius: 12px; line-height: 1; }
  .metric-copy { display: flex; flex-direction: column; gap: 6px; }
  .mc-top { font-size: 22px; color: #CBD5E1; white-space: nowrap; }
  .mc-top b { color: #FFFFFF; font-family: "SubBold", sans-serif; }
  .mc-bot { font-size: 22.5px; color: #FACC15; font-family: "SubBold", sans-serif; white-space: nowrap; }

  /* K10 Meter */
  .meter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 22.5px; white-space: nowrap; }
  .meter-row:last-child { margin-bottom: 0; }
  .m-lbl { width: 155px; color: #94A3B8; }
  .m-track { flex: 1; height: 12px; background: rgba(255,255,255,0.10); border-radius: 99px; overflow: hidden; }
  .m-fill.low { width: 16%; height: 100%; background: #64748B; border-radius: 99px; }
  .m-fill.high { width: 94%; height: 100%; background: #FACC15; border-radius: 99px; }
  .m-val { width: 105px; text-align: right; font-size: 20.5px; color: #94A3B8; }

  /* K02 Callout */
  .box-k02 { border-top: 3px solid #FACC15; }
  .q-line1 { font-size: 24px; color: #94A3B8; margin-bottom: 10px; white-space: nowrap; }
  .q-line2 { font-family: "SubBold", sans-serif; font-size: 25px; color: #FFFFFF; white-space: nowrap; }

  /* K15 Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
  .day { text-align: center; padding: 6px 0; border-radius: 7px; background: rgba(255,255,255,0.06); color: #64748B; font-size: 19px; }
  .day.on { background: rgba(250,204,21,0.22); border: 1px solid #FACC15; color: #FACC15; font-weight: 800; }
  .cal-caption { font-family: "SubBold", sans-serif; font-size: 23.5px; color: #FFFFFF; white-space: nowrap; }

  .meta {
    font-family: "MetaMono", monospace;
    font-size: 24px;
    color: #E2E8F0;
    letter-spacing: 0.01em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #F59E0B; }
</style></head>
<body>
  <div class="zone">
    <h1 class="headline" style="letter-spacing: -0.0135em; font-size: 86px; line-height: 1.09;">
      <span class="line" style="line-height: 1.09;">Đừng ép mình</span>
      <span class="line" style="line-height: 1.09;">đăng bài <span class="hl">vội vã</span></span>
      <span class="line" style="line-height: 1.09;">mỗi ngày.</span>
    </h1>
    
        <div class="sub-box box-k20">
          <div class="def-row old"><span class="badge-muted">BỆNH KÊNH</span><span>Đăng đều <b class="mono">07/07</b> ngày nhưng vắng khách</span></div>
          <div class="div-line"></div>
          <div class="def-row new"><span class="badge-gold">PHÁC ĐỒ</span><span><b class="mono">01</b> bài trúng bệnh → khách tự nhắn</span></div>
        </div>
        
    <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
  </div>
</body></html>
