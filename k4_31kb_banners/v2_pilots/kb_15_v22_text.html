<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "HeadFont";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 800;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  @font-face {
    font-family: "SubReg";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Regular.ttf");
    font-weight: 400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }

  .zone {
    position: absolute;
    left: 54px;
    top: 120px;
    width: 492px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
  }

  /* KHỐI 1: TAGLINE + HEADLINE KẾT KHỐI CHỮ NHẬT ĐẶC KHÍT 2 BÊN (SWISS SLAB LOCKUP) */
  .hero-lockup {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin-bottom: 30px;
  }

  .kicker-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: #FBBF24;
    color: #070B14;
    padding: 12px 20px;
    border-radius: 8px;
    margin-bottom: 12px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  .kicker-title {
    font-family: "SubBold", sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .kicker-dot {
    font-family: "SubBold", sans-serif;
    font-size: 22px;
    font-weight: 800;
  }

  .headline-slab {
    font-family: "HeadFont", sans-serif;
    color: #FFFFFF;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .slab-line {
    display: block;
    width: max-content;
    white-space: nowrap;
    line-height: 1.03;
    letter-spacing: -0.02em;
  }
  .kw-highlight {
    color: #FBBF24;
  }

  /* KHỐI 2: CHỮ PHỤ TO RÕ (38PX) ĐÓNG KHUNG CẤU TRÚC ĐỒNG BỘ CHIỀU RỘNG */
  .sub-box {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border-left: 6px solid #FBBF24;
    border-radius: 0 12px 12px 0;
    padding: 22px 24px;
    margin-bottom: 28px;
  }
  .subline {
    font-family: "SubReg", sans-serif;
    font-size: 37px;
    line-height: 1.32;
    color: #F8FAFC;
  }
  .subline strong {
    font-family: "SubBold", sans-serif;
    color: #FBBF24;
    font-weight: 700;
  }

  /* KHỐI 3: FOOTER CTA TRÊN 1 DÒNG DUY NHẤT CÂN XỨNG 100% KHỐI CHỮ */
  .cta-full {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: rgba(11, 16, 28, 0.94);
    border: 2px solid #FBBF24;
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
  }
  .cta-main {
    font-family: "SubBold", sans-serif;
    font-size: 26px;
    color: #FFFFFF;
    white-space: nowrap;
    line-height: 1.15;
  }
  .cta-badge {
    font-family: "SubBold", sans-serif;
    font-size: 24px;
    background: #FBBF24;
    color: #070B14;
    padding: 8px 15px;
    border-radius: 8px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="zone" id="zone">
    <div class="hero-lockup" id="hero-lockup">
      <div class="kicker-bar" id="kicker-bar">
        <span class="kicker-title">SAI LẦM LỊCH ĐĂNG BÀI</span>
        <span class="kicker-dot">✦</span>
      </div>
      <h1 class="headline-slab" id="headline-slab"><span class="slab-line">ĐỪNG ÉP MÌNH</span><span class="slab-line">ĐĂNG BÀI</span><span class="slab-line"><span class="kw-highlight">VỘI VÃ</span> MỖI NGÀY</span></h1>
    </div>
    <div class="sub-box" id="sub-box">
      <p class="subline"><strong>1 video chạm đúng nỗi đau</strong> giữ chân khách hơn 10 clip quay ẩu cho đủ lịch.</p>
    </div>
    <div class="cta-full" id="cta-full">
      <span class="cta-main">Hà Nội · 07–08/11</span>
      <span class="cta-badge">Còn 17/35 chỗ</span>
    </div>
  </div>
</body>
</html>
