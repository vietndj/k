<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDUntitledSerif-Bold.woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 48px; top: 190px; width: 460px; height: 920px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 68px;
    line-height: 1.08;
    letter-spacing: -0.012em;
    color: #FFFFFF;
    margin-bottom: 36px;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .headline .line { display: block; white-space: nowrap; }
  .headline .hl { color: #F59E0B; }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 24px;
    color: #CBD5E1;
    letter-spacing: 0.03em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #F59E0B; }
  
          .sticky-wrap {
            padding-top: 10px;
            padding-left: 6px;
            margin-bottom: 42px;
          }
          .sticky-note {
            position: relative;
            width: 424px;
            background: linear-gradient(165deg, #FEF08A 0%, #FACC15 100%);
            color: #0F172A;
            padding: 28px 26px 22px 26px;
            border-radius: 6px 6px 18px 6px;
            transform: rotate(-2.2deg);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.55);
          }
          .sticky-note::before {
            content: "";
            position: absolute;
            top: -13px;
            left: 50%;
            width: 124px;
            height: 28px;
            margin-left: -62px;
            background: rgba(255, 255, 255, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.35);
            transform: rotate(3.2deg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
          }
          .st-tag {
            font-family: "SubBold", sans-serif;
            font-size: 19px;
            letter-spacing: 0.06em;
            color: #713F12;
            margin-bottom: 6px;
          }
          .st-line1 {
            font-family: "SubBold", sans-serif;
            font-size: 28px;
            line-height: 1.25;
            color: #1E293B;
            white-space: nowrap;
          }
          .st-line2 {
            font-family: "SubBold", sans-serif;
            font-size: 32px;
            line-height: 1.25;
            color: #0F172A;
            white-space: nowrap;
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-underline-offset: 5px;
          }
        
</style></head>
<body>
  <div class="zone">
    <h1 class="headline">
      <span class="line">Đừng ép mình</span>
      <span class="line">đăng bài <span class="hl">vội vã</span></span>
      <span class="line">mỗi ngày.</span>
    </h1>
    
          <div class="sticky-wrap">
            <div class="sticky-note">
              <div class="st-tag">📌 GHI NHỚ LÀM NGHỀ:</div>
              <div class="st-line1">Đừng đăng cho đủ lịch.</div>
              <div class="st-line2">Đăng để khách tự nhắn.</div>
            </div>
          </div>
          <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
        
  </div>
</body></html>
