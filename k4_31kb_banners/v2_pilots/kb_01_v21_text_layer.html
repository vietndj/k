<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "HeadFont";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDTiemposHeadline-Bold.woff2");
    font-weight: 900;
  }
  @font-face {
    font-family: "SubFont";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDRMNeue-SemiBold.woff2");
    font-weight: 600;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }

  .lockup-zone {
    position: absolute;
    left: 490px;
    top: 150px;
    width: 526px;
    height: 1020px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  /* KHỐI 1: TAGLINE + CHỮ TO ĐƯỢC KHÓA THÀNH 1 KHỐI THỊ GIÁC ĐẶC (HEADER LOCKUP) */
  .primary-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    margin-bottom: 34px;
  }
  .kicker-row {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    background: rgba(251, 191, 36, 0.14);
    border-left: 5px solid #F59E0B;
    padding: 7px 18px 7px 14px;
    border-radius: 0 8px 8px 0;
  }
  .kicker-text {
    font-family: "SubFont", sans-serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #F59E0B;
    line-height: 1.1;
  }
  .headline {
    font-family: "HeadFont", sans-serif;
    font-size: 102.0px;
    line-height: 1.03;
    letter-spacing: -0.025em;
    color: #FFFFFF;
    width: 100%;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .h-line {
    display: block;
    width: max-content;
    white-space: nowrap;
  }
  .kw {
    color: #F59E0B;
  }

  /* KHỐI 2: CHỮ PHỤ CỠ LỚN DỄ ĐỌC (38-40PX SEMIBOLD) CÓ THANH NEO DỌC */
  .sub-cluster {
    border-left: 4px solid rgba(255, 255, 255, 0.28);
    padding-left: 20px;
    margin-bottom: 42px;
  }
  .subline {
    font-family: "SubFont", sans-serif;
    font-size: 38.0px;
    line-height: 1.32;
    letter-spacing: -0.005em;
    color: #F1F5F9;
    max-width: 516px;
  }
  .subline strong {
    color: #FFFFFF;
  }

  /* KHỐI 3: NÚT HÀNH ĐỘNG ĐẦY ĐẶN CÂN XỨNG KHỐI CHỮ */
  .cta-bar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #F59E0B;
    color: #070B14;
    font-family: "HeadFont", sans-serif;
    font-size: 29.0px;
    font-weight: 800;
    line-height: 1.15;
    padding: 20px 34px;
    border-radius: 14px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    box-shadow: 0 16px 38px rgba(0, 0, 0, 0.48);
  }
</style>
</head>
<body>
  <div class="lockup-zone" id="lockup-zone">
    <div class="primary-cluster" id="primary-cluster">
      <div class="kicker-row" id="kicker-row">
        <span class="kicker-text">BẪY NỘI DUNG ĐẠI TRÀ</span>
      </div>
      <h1 class="headline" id="headline"><span class="h-line">Trăm clip</span><span class="h-line">vẫn <span class="kw">tàng hình</span></span><span class="h-line">với khách mua</span></h1>
    </div>
    <div class="sub-cluster" id="sub-cluster">
      <p class="subline" id="subline">Khách chỉ xuống tiền khi thấy <strong>góc nhìn riêng</strong> và <strong>năng lực thật</strong> của bạn.</p>
    </div>
    <div class="cta-bar" id="cta-bar">Offline Hà Nội 07–08/11 · Còn 17/35 chỗ</div>
  </div>
</body>
</html>
