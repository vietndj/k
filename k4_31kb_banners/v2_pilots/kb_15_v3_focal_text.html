<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDTiemposHeadline-Bold.woff2");
    font-weight: 800;
  }
  @font-face {
    font-family: "SubSans";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Regular.ttf");
    font-weight: 400;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }

  .focal-zone {
    position: absolute;
    left: 68px;
    top: 220px;
    width: 480px;
    height: 860px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  /* CẤP 1 (THÔNG TIN CHÍNH - CHIẾM 80% TRỌNG LƯỢNG THỊ GIÁC):
     1 cỡ chữ đồng nhất (82px), Sentence case đĩnh đạc, đúng 1 điểm nhấn màu vàng duy nhất */
  .main-headline {
    font-family: "HeadSerif", serif;
    font-size: 82px;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #F8FAFC;
    margin-bottom: 32px;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .main-headline .line {
    display: block;
    white-space: nowrap;
  }
  .main-headline .focal-kw {
    color: #F59E0B;
  }

  /* CẤP 2 (THÔNG TIN BỔ TRỢ - 1 CÂU NGẮN 9 TỪ, 1 MÀU DỊU, KHÔNG HỘP XÁM, KHÔNG TÔ VÀNG TRANH CHẤP) */
  .sub-thought {
    font-family: "SubSans", sans-serif;
    font-size: 32px;
    line-height: 1.38;
    color: rgba(226, 232, 240, 0.86);
    max-width: 450px;
    margin-bottom: 44px;
  }

  /* CẤP 3 (THÔNG TIN TĨNH - CHỮ KÝ LỚP HỌC NHỎ GỌN, KHÔNG KHUNG VIỀN LOẠN) */
  .meta-signature {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 22px;
    border-top: 1px solid rgba(248, 250, 252, 0.18);
    width: 380px;
    font-family: "SubMed", sans-serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: rgba(203, 213, 225, 0.78);
  }
  .meta-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #F59E0B;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="focal-zone">
    <h1 class="main-headline">
      <span class="line">Đừng ép mình</span>
      <span class="line">đăng bài <span class="focal-kw">vội vã</span></span>
      <span class="line">mỗi ngày.</span>
    </h1>
    <p class="sub-thought">
      Khách không đếm số bài bạn đăng, họ chỉ nhớ bài nói trúng việc đang vướng.
    </p>
    <div class="meta-signature">
      <span class="meta-dot"></span>
      <span>Offline Hà Nội · 07–08/11</span>
    </div>
  </div>
</body>
</html>
