    position: absolute; left: 552px; top: 185px; width: 492px; height: 970px;

  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 80px;

  .accent-txt { color: #38BDF8; font-family: "SubBold", sans-serif; }

  .sub-box { display: grid; grid-template-columns: 92px 2px 1fr; gap: 12px; align-items: center; }
  .s-badge { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 2px; }
  .s-num { font-family: "MetaMono", monospace; font-size: 50px; line-height: 1; color: #38BDF8; }
  .s-lbl { font-family: "SubBold", sans-serif; font-size: 19.5px; color: #E2E8F0; margin-top: 4px; }
  .s-div { width: 2px; height: 64px; background: #38BDF8; opacity: 0.45; }
  .s-right { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .sr-1 { font-family: "SubMed", sans-serif; font-size: 26.5px; color: #E2E8F0; white-space: nowrap; display: block; }
  .sr-2 { font-family: "SubBold", sans-serif; font-size: 27.5px; color: #FFFFFF; white-space: nowrap; display: block; }

<body><div class="zone" style="width: 595px; left: 437px; right: auto; top: 190px; transform: none;">
  <h1 class="headline" style="letter-spacing: -0.02em; font-size: 81px; line-height: 1.173;"><span class="line" style="width: fit-content; letter-spacing: -0.02em; line-height: 1.173;">100 người lướt</span>

    <div class="s-badge" style="font-size: 19px; min-width: 100px; width: 100px; flex-shrink: 0;"><span class="s-num big-metric">03s</span><span class="s-lbl p-tag">LƯỚT</span></div>

    <div class="s-right" style="font-size: 19px;">
      <span class="sr-1 auto-sub" style="width: fit-content; font-size: 26.5px;">Clip 15s: khách lướt</span>
      <span class="sr-2 auto-sub" style="width: fit-content; font-size: 27.5px;">Nghe 3 phút: dám mua</span>

  </div>
