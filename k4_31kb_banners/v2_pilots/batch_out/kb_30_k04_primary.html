<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDTiemposHeadline-Bold.woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 544px; top: 190px; width: 492px; height: 920px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 71px;
    line-height: 1.09;
    letter-spacing: -0.014em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .headline .line { display: block; white-space: nowrap; }
  .headline .hl { color: #F59E0B; }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 25px;
    color: #CBD5E1;
    letter-spacing: 0.03em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #F59E0B; }

  .tab-box {
    position: relative;
    width: 486px;
    background: rgba(5, 9, 18, 0.80);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 32px 22px 22px;
    margin-bottom: 42px;
  }
  .floating-tab {
    position: absolute;
    top: -15px;
    left: 22px;
    background: #F59E0B;
    color: #070B14;
    font-family: "SubBold", sans-serif;
    font-size: 18px;
    letter-spacing: 0.09em;
    padding: 5px 14px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .l1 { font-family: "SubBold", sans-serif; font-size: 29.5px; line-height: 1.32; color: #FFFFFF; white-space: nowrap; display: block; }
  .l2 { font-family: "SubMed", sans-serif; font-size: 28.5px; line-height: 1.35; color: #CBD5E1; white-space: nowrap; display: block; }
</style></head>
<body>
  <div class="zone">
    <h1 class="headline" style="font-size: 55px; line-height: 1.165;">
      <span class="line" style="line-height: 1.165;">Định bỏ trăm triệu</span>
      <span class="line" style="line-height: 1.165;">nhập máy mới về</span>
      <span class="line" style="line-height: 1.165;">mà <span class="hl">chưa có khách?</span></span>
    </h1>
    <div class="tab-box">
      <span class="floating-tab">ĐIỂM MẤU CHỐT</span>
      <span class="l1 auto-sub" style="font-size: 24px;">Làm 3 video đo lực cầu thị trường trước,</span>
      <span class="l2 auto-sub" style="font-size: 23.5px;">có khách đặt lịch rồi mới xuống tiền nhập.</span>
    </div>
    <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
  </div>
</body></html>
