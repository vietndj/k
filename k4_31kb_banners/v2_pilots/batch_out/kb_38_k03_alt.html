  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 552px; top: 185px; width: 492px; height: 970px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 84px;
    line-height: 1.03;
    letter-spacing: -0.013em;
    color: #FFFFFF;
    margin-bottom: 38px;
    width: max-content;
    text-shadow: 0 14px 34px rgba(0, 0, 0, 0.68);
  }
  .headline .line { display: block; width: max-content; white-space: nowrap; font-size: 1em; }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: normal;
    font-weight: 700;
    font-size: 1em;

  }
  .sub-box {
    width: 484px;
    max-width: 484px;
    background: rgba(3, 6, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 40px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 20.0px;
    color: #CBD5E1;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #38BDF8; }
  .accent-txt { color: #38BDF8; font-family: "SubBold", sans-serif; }

  .sub-box { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: center; }
  .col-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .n-gold { font-family: "MetaMono", monospace; font-size: 56px; line-height: 1.0; color: #38BDF8; white-space: nowrap; }
  .n-white { font-family: "MetaMono", monospace; font-size: 56px; line-height: 1.0; color: #FFFFFF; white-space: nowrap; }
  .lbl-sub { font-family: "SubMed", sans-serif; font-size: 26.5px; line-height: 1.25; color: #E2E8F0; white-space: normal; word-wrap: break-word; }
  .arrow { font-family: "SubBold", sans-serif; font-size: 28px; color: #38BDF8; text-align: center; }

<body><div class="zone" style="width: 509px; left: 523px; right: auto; top: 190px; transform: none;">
  <h1 class="headline" style="letter-spacing: -0.02em; font-size: 67px; line-height: 1.097;"><span class="line" style="width: fit-content; letter-spacing: -0.02em; line-height: 1.097;">Não người xem</span>

  <div class="sub-box" style="width: 509px; max-width: 509px; box-sizing: border-box; padding-right: 14px;">
    <div class="col-stat" style="font-size: 19px;"><span class="n-gold big-metric">07</span><span class="lbl-sub auto-sub">ý nhồi nhét trôi tuột</span></div>
    <div class="arrow" style="width: auto; min-width: 26px; flex-shrink: 0; margin-left: 10px; margin-right: 10px;">→</div>
    <div class="col-stat" style="padding-left: 14px; font-size: 19px;"><span class="n-white big-metric">01</span><span class="lbl-sub auto-sub" style="color:#FFFFFF;font-family:'SubBold',sans-serif;">hình ảnh găm sâu vào trí</span></div>
  </div>
  <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
