<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face {

    font-weight: 700;

  @font-face {

  @font-face {

    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDMonumentGroteskMono-Bold.woff2");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 34px; top: 185px; width: 436px; height: 970px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 90px;
    line-height: 1.03;
    letter-spacing: -0.013em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 14px 34px rgba(0, 0, 0, 0.68);
  }
  .headline .line { display: block; width: max-content; white-space: nowrap; font-size: 1em; }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1em;
    color: #FACC15;
    text-shadow: 0 12px 30px rgba(0, 0, 0, 0.78);
  }
  .sub-box {
    width: 432px;
    max-width: 432px;
    background: rgba(3, 6, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 40px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 24.5px;
    color: #E2E8F0;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #FACC15; }
  .accent-txt { color: #FACC15; font-family: "SubBold", sans-serif; }

  .sub-box { display: grid; grid-template-columns: 86px 2px 1fr; gap: 14px; align-items: center; }
  .s-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .s-num { font-family: "MetaMono", monospace; font-size: 42px; line-height: 1; color: #FACC15; }
  .s-lbl { font-family: "SubBold", sans-serif; font-size: 19.5px; color: #94A3B8; margin-top: 4px; }
  .s-div { width: 2px; height: 64px; background: #FACC15; opacity: 0.45; }
  .s-right { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .sr-1 { font-family: "SubMed", sans-serif; font-size: 25px; color: #94A3B8; white-space: nowrap; display: block; }
  .sr-2 { font-family: "SubBold", sans-serif; font-size: 26px; color: #FFFFFF; white-space: nowrap; display: block; }
</style></head>
<body><div class="zone">
  <h1 class="headline" style="font-size: 54px; line-height: 1.083;"><span class="line" style="line-height: 1.083;">Ngành khô như ngói</span>
      <span class="line" style="line-height: 1.083;">lại là mảnh đất</span>
      <span class="line" style="line-height: 1.083;">một mình <span class="hl">một chợ.</span></span></h1>
  <div class="sub-box">
    <div class="s-badge"><span class="s-num">03s</span><span class="s-lbl">LƯỚT</span></div>
    <div class="s-div"></div>
    <div class="s-right">
      <span class="sr-1 auto-sub" style="font-size: 19.5px; letter-spacing: -0.025em;">Sợ ngành kỹ thuật khô khan:</span>
      <span class="sr-2 auto-sub" style="font-size: 19.5px; letter-spacing: -0.025em;">Đối thủ đều ngại nói: bạn lên là</span>
    </div>
  </div>
  <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
</div></body></html>
