  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 544px; top: 190px; width: 492px; height: 920px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 74px;
    line-height: 1.08;

  }
  .headline .line { display: block; white-space: nowrap; }
  .headline .hl { color: #F59E0B; }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 25px;
    color: #CBD5E1;

  .unified-card {

    font-size: 29px;
    line-height: 1.38;

  }
  .uc-body strong {
    font-family: "SubBold", sans-serif;
    color: #FFFFFF;
    border-bottom: 4px solid #F59E0B;
    padding-bottom: 2px;
  }
  .uc-foot {
    background: rgba(245, 158, 11, 0.14);
    border-top: 1px solid rgba(245, 158, 11, 0.30);
    padding: 13px 22px;
    font-family: "SubBold", sans-serif;
    font-size: 24px;
    color: #FBBF24;
    display: flex;
    justify-content: space-between;
    align-items: center;

<body>
  <div class="zone">

        <span>→</span>
      </div>
    </div>
  </div>
