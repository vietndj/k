  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 40px; top: 185px; width: 492px; height: 970px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 86px;
    line-height: 1.07;
    letter-spacing: -0.013em;
    color: #FFFFFF;
    margin-bottom: 38px;
    width: max-content;
    text-shadow: 0 14px 34px rgba(0, 0, 0, 0.68);
  }
  .headline .line { display: block; width: max-content; white-space: nowrap; font-size: 1em; }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1em;
    color: #FACC15;
    text-shadow: 0 12px 30px rgba(0, 0, 0, 0.78);
  }
  .sub-box {
    width: 484px;
    max-width: 484px;
    background: rgba(3, 6, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 40px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 20.0px;
    color: #CBD5E1;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #FACC15; }
  .accent-txt { color: #FACC15; font-family: "SubBold", sans-serif; }

  .sub-box { display: flex; flex-direction: column; gap: 12px; }
  .eq-top { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .eq-chip { background: rgba(226,232,240,0.16); border: 1px solid rgba(255,255,255,0.24); border-radius: 8px; padding: 4px 11px; font-family: "SubBold", sans-serif; font-size: 23.5px; color: #F8FAFC; }
  .eq-plus { font-family: "MetaMono", monospace; font-size: 24px; color: #FACC15; }
  .eq-bot { font-family: "SubBold", sans-serif; font-size: 27.5px; color: #FFFFFF; white-space: nowrap; display: block; }

<body><div class="zone" style="width: 537px; top: 190px; transform: none;">
  <h1 class="headline" style="letter-spacing: -0.02em; font-size: 81px; line-height: 1.179;"><span class="line" style="width: fit-content; letter-spacing: -0.02em; line-height: 1.179;">Đặt máy <span class="hl">một chỗ</span></span>
      <span class="line" style="width: fit-content; letter-spacing: -0.02em; line-height: 1.179;">ngồi xuống là</span>
      <span class="line" style="width: fit-content; letter-spacing: -0.02em; line-height: 1.179;">bấm quay luôn.</span></h1>
  <div class="sub-box" style="width: 537px; max-width: 537px; box-sizing: border-box; padding-right: 14px;">
    <div class="eq-top" style="font-size: 19px;"><span class="eq-chip p-tag">Đúng nỗi đau</span><span class="eq-plus p-tag">+</span><span class="eq-chip p-tag">Chất nghề thật</span></div>
    <span class="eq-bot auto-sub" style="width: fit-content; font-size: 27.5px;"><span class="accent-txt">=</span> Một sải tay: bấm máy</span>
  </div>
  <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
</div></body></html>
