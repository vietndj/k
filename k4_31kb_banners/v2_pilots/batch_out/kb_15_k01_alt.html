  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 40px; top: 185px; width: 512px; height: 970px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 90px;
    line-height: 1.03;
    letter-spacing: -0.013em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 14px 34px rgba(0, 0, 0, 0.68);
  }
  .headline .line { display: block; width: max-content; white-space: nowrap; font-size: 1em; }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1em;
    color: #34D399;
    text-shadow: 0 12px 30px rgba(0, 0, 0, 0.78);
  }
  .sub-box {
    width: 504px;
    max-width: 504px;
    background: rgba(3, 6, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 40px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 24.5px;
    color: #E2E8F0;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34D399; }
  .accent-txt { color: #34D399; font-family: "SubBold", sans-serif; }

  .sub-box { border-left: 4px solid #34D399; display: flex; flex-direction: column; gap: 13px; }
  .row { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
  .icon-x { font-family: "SubBold", sans-serif; font-size: 25px; color: #EF4444; width: 22px; text-align: center; flex-shrink: 0; }
  .icon-ok { font-family: "SubBold", sans-serif; font-size: 25px; color: #34D399; width: 22px; text-align: center; flex-shrink: 0; }
  .txt-old { font-family: "SubMed", sans-serif; font-size: 26.5px; color: #94A3B8; white-space: nowrap; }
  .txt-new { font-family: "SubBold", sans-serif; font-size: 27.5px; color: #FFFFFF; white-space: nowrap; }

<body><div class="zone">
  <h1 class="headline" style="font-size: 86px; line-height: 1.029;"><span class="line" style="line-height: 1.029;">Đừng ép mình</span>

      <span class="line" style="line-height: 1.029;">mỗi ngày.</span></h1>
  <div class="sub-box">
    <div class="row"><span class="icon-x">×</span><span class="txt-old auto-sub" style="font-size: 24.5px;">10 clip quay vội: khách xem rồi lướt qua</span></div>
    <div class="row"><span class="icon-ok">✓</span><span class="txt-new auto-sub" style="font-size: 25px;">1 bài trúng việc: khách nhớ &amp; tự nhắn</span></div>
  </div>
  <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
</div></body></html>
