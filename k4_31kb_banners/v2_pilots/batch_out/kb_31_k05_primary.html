<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/GT-Sectra-LCGV-Display-Bold.otf");
    font-weight: 700;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 42px; top: 190px; width: 492px; height: 920px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 75px;
    line-height: 1.09;
    letter-spacing: -0.014em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .headline .line { display: block; white-space: nowrap; }
  .headline .hl { color: #F59E0B; }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 25px;
    color: #CBD5E1;
    letter-spacing: 0.03em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #F59E0B; }

  .offset-wrap {
    position: relative;
    width: 480px;
    margin-bottom: 48px;
  }
  .offset-bg {
    position: absolute;
    inset: 0;
    transform: translate(10px, 10px);
    background: rgba(245, 158, 11, 0.24);
    border-radius: 10px;
  }
  .offset-front {
    position: relative;
    background: rgba(6, 10, 19, 0.84);
    border: 1px solid rgba(245, 158, 11, 0.45);
    border-radius: 10px;
    padding: 22px 22px;
  }
  .l1 { font-family: "SubMed", sans-serif; font-size: 28px; line-height: 1.35; color: #E2E8F0; margin-bottom: 4px; white-space: nowrap; display: block; }
  .l2 { font-family: "SubBold", sans-serif; font-size: 30px; line-height: 1.35; color: #FFFFFF; white-space: nowrap; display: block; }
  .l2 em { font-style: normal; color: #F59E0B; padding: 0 3px; }
</style></head>
<body>
  <div class="zone">
    <h1 class="headline" style="font-size: 52px; line-height: 1.1;">
      <span class="line" style="line-height: 1.1;">AI viết trăm bài</span>
      <span class="line" style="line-height: 1.1;">nhưng không đứng ra</span>
      <span class="line" style="line-height: 1.1;"><span class="hl">chịu trách nhiệm.</span></span>
    </h1>
    <div class="offset-wrap">
      <div class="offset-bg"></div>
      <div class="offset-front">
        <span class="l1 auto-sub" style="font-size: 24.5px;">Đưa mặt thật và cam kết nghề lên kênh</span>
        <span class="l2 auto-sub" style="font-size: 27.5px;"><em>→</em> vượt rừng AI <em>→</em> khách chọn bạn.</span>
      </div>
    </div>
    <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
  </div>
</body></html>
