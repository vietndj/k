<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDFinancierDisplay-Bold.woff2");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "HeadFocal";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDFinancierDisplay-BoldItalic.woff2");
    font-weight: 700;
    font-style: italic;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  @font-face {
    font-family: "MetaMono";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDMonumentGroteskMono-Bold.woff2");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 40px; top: 185px; width: 512px; height: 970px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 90px;
    line-height: 1.02;
    letter-spacing: -0.013em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 14px 34px rgba(0, 0, 0, 0.68);
  }
  .headline .line { display: block; width: max-content; white-space: nowrap; font-size: 1em; }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1em;
    color: #38BDF8;
    text-shadow: 0 12px 30px rgba(0, 0, 0, 0.78);
  }
  .sub-box {
    width: 504px;
    max-width: 504px;
    background: rgba(3, 6, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 40px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 24.5px;
    color: #E2E8F0;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #38BDF8; }
  .accent-txt { color: #38BDF8; font-family: "SubBold", sans-serif; }

  .sub-box { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; }
  .col-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .n-gold { font-family: "MetaMono", monospace; font-size: 46px; line-height: 1.0; color: #38BDF8; white-space: nowrap; }
  .n-white { font-family: "MetaMono", monospace; font-size: 44px; line-height: 1.0; color: #FFFFFF; white-space: nowrap; }
  .lbl-sub { font-family: "SubMed", sans-serif; font-size: 24.5px; line-height: 1.25; color: #CBD5E1; white-space: nowrap; }
  .arrow { font-family: "SubBold", sans-serif; font-size: 28px; color: #38BDF8; text-align: center; }
</style></head>
<body><div class="zone">
  <h1 class="headline" style="font-size: 58px; line-height: 0.991;"><span class="line" style="line-height: 0.991;">Nói chữ chuyên ngành</span>
      <span class="line" style="line-height: 0.991;">khách nghe xong</span>
      <span class="line" style="line-height: 0.991;"><span class="hl">quên sạch</span> ngay.</span></h1>
  <div class="sub-box">
    <div class="col-stat"><span class="n-gold">10x</span><span class="lbl-sub auto-sub">tốn sức kiểu cũ</span></div>
    <div class="arrow">→</div>
    <div class="col-stat" style="padding-left: 8px;"><span class="n-white">01</span><span class="lbl-sub auto-sub" style="font-size: 19.5px;">bài chuẩn khách nhắn</span></div>
  </div>
  <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
</div></body></html>
