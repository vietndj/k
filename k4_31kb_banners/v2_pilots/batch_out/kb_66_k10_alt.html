<style>

  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 528px; top: 185px; width: 512px; height: 970px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 80px;
    line-height: 1.12;
    letter-spacing: -0.013em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 14px 34px rgba(0, 0, 0, 0.68);
  }
  .headline .line { display: block; width: max-content; white-space: nowrap; font-size: 1em; }
  .headline .hl {
    font-family: "HeadFocal", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 1em;
    color: #38BDF8;
    text-shadow: 0 12px 30px rgba(0, 0, 0, 0.78);
  }
  .sub-box {
    width: 504px;
    max-width: 504px;
    background: rgba(3, 6, 14, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    padding: 20px 20px;
    margin-bottom: 40px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 24.5px;
    color: #E2E8F0;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #38BDF8; }
  .accent-txt { color: #38BDF8; font-family: "SubBold", sans-serif; }

  .sub-box { display: flex; flex-direction: column; gap: 13px; }
  .m-row { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .m-lbl { font-family: "SubBold", sans-serif; font-size: 23px; color: #CBD5E1; width: 145px; flex-shrink: 0; }
  .m-track { flex: 1; height: 12px; background: rgba(255, 255, 255, 0.12); border-radius: 99px; overflow: hidden; }
  .m-fill-low { width: 18%; height: 100%; background: #64748B; border-radius: 99px; }
  .m-fill-high { width: 94%; height: 100%; background: #38BDF8; border-radius: 99px; }
  .m-val { font-family: "MetaMono", monospace; font-size: 22px; color: #94A3B8; width: 105px; text-align: right; flex-shrink: 0; }
  .m-val.hi { color: #38BDF8; }
</style></head>
<body><div class="zone">
  <h1 class="headline" style="font-size: 59px; line-height: 1.082;"><span class="line" style="line-height: 1.082;">Tiếc ba mươi phút</span>
      <span class="line" style="line-height: 1.082;">quay bài mỗi tuần,</span>
      <span class="line" style="line-height: 1.082;">mất <span class="hl">cả ngày</span> chờ.</span></h1>
  <div class="sub-box">
    <div class="m-row"><span class="m-lbl">Cách làm cũ</span><div class="m-track"><div class="m-fill-low"></div></div><span class="m-val">10% nhớ</span></div>
    <div class="m-row"><span class="m-lbl accent-txt">Chuẩn nghề K4</span><div class="m-track"><div class="m-fill-high"></div></div><span class="m-val hi">95% nhắn</span></div>
  </div>
  <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
</div></body></html>
