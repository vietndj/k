<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDHeldaneDisplay-Bold.woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 40px; top: 135px; width: 570px; height: 1090px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 86px;
    line-height: 1.08;
    letter-spacing: -0.010em;
    color: #FFFFFF;
    margin-bottom: 52px;
    text-shadow: 0 14px 36px rgba(0, 0, 0, 0.72);
  }
  .headline .line {
    display: block;
    width: max-content;
    white-space: nowrap;
  }
  .headline .hl {
    color: #FACC15;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.80);
  }
  .contrast-panel {
    width: 520px;
    max-width: 520px;
    background: rgba(6, 10, 19, 0.80);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 46px;
    box-shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
  }
  .row-bad {
    font-family: "SubMed", sans-serif;
    font-size: 29.5px;
    color: #94A3B8;
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    margin-bottom: 16px;
    white-space: nowrap;
  }
  .row-bad .icon { color: #F87171; font-family: "SubBold", sans-serif; font-size: 31px; }
  .row-good {
    font-family: "SubBold", sans-serif;
    font-size: 30.5px;
    color: #FFFFFF;
    display: flex; align-items: center; gap: 14px;
    white-space: nowrap;
  }
  .row-good .icon { color: #FACC15; font-size: 32px; }
  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 27px;
    color: #E2E8F0;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #F59E0B; }
</style></head>
<body>
  <div class="zone">
    <h1 class="headline" style="letter-spacing: -0.0109em; font-size: 96px; line-height: 1.03;">
      <span class="line" style="line-height: 1.03;">Đừng ép mình</span>
      <span class="line" style="line-height: 1.03;">đăng bài <span class="hl">vội vã</span></span>
      <span class="line" style="line-height: 1.03;">mỗi ngày.</span>
    </h1>
    <div class="contrast-panel sub-box">
      <div class="row-bad"><span class="icon">×</span><span>10 clip quay vội: khách lướt</span></div>
      <div class="row-good"><span class="icon">✓</span><span>1 bài trúng việc: khách nhắn</span></div>
    </div>
    <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
  </div>
</body></html>
