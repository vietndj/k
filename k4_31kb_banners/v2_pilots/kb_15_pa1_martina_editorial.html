<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "HeadSerif";
    src: url("file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDMartinaPlantijn-Bold.woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "SubMed";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Medium.ttf");
    font-weight: 500;
  }
  @font-face {
    font-family: "SubBold";
    src: url("file:///Users/vietmac/.gemini/config/skills/auto-edit-video/remotion-studio/public/fonts/FDAeonik-Bold.ttf");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { width: 1080px; height: 1350px; background: transparent; overflow: hidden; position: relative; }
  .zone {
    position: absolute; left: 52px; top: 200px; width: 456px; height: 900px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .headline {
    font-family: "HeadSerif", serif;
    font-size: 79px;
    line-height: 1.08;
    letter-spacing: -0.015em;
    color: #FFFFFF;
    margin-bottom: 38px;
    text-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }
  .headline .line { display: block; white-space: nowrap; }
  .headline .hl { color: #F59E0B; }

  .sub-wrap {
    border-left: 5px solid #F59E0B;
    padding-left: 20px;
    margin-bottom: 46px;
  }
  .sub-text {
    font-family: "SubMed", sans-serif;
    font-size: 34px;
    line-height: 1.42;
    color: #F8FAFC;
    white-space: nowrap;
    text-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
  .sub-text strong {
    font-family: "SubBold", sans-serif;
    color: #FEF08A;
    font-weight: 700;
  }

  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 24px;
    color: #CBD5E1;
    letter-spacing: 0.03em;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #F59E0B; }
</style></head>
<body>
  <div class="zone">
    <h1 class="headline">
      <span class="line">Đừng ép mình</span>
      <span class="line">đăng bài <span class="hl">vội vã</span></span>
      <span class="line">mỗi ngày.</span>
    </h1>
    <div class="sub-wrap">
      <p class="sub-text">
        Khách không đếm số bài đăng,<br/>
        họ chỉ nhớ <strong>bài nói trúng việc.</strong>
      </p>
    </div>
    <div class="meta"><span class="dot"></span><span>Offline Hà Nội · 07–08/11</span></div>
  </div>
</body></html>
