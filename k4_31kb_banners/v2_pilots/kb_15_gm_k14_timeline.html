          .tl-card {

            gap: 20px;
          }
          .tl-line {
            position: absolute;

            bottom: 38px;

          }
          .tl-step {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 2;
          }
          .dot-old {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0F172A;
            border: 3px solid #94A3B8;
            flex-shrink: 0;
          }
          .dot-new {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #F59E0B;
            box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.25);
            flex-shrink: 0;
          }
          .tl-txt-old {
            font-family: "SubMed", sans-serif;
            font-size: 26px;
            color: #94A3B8;
            white-space: nowrap;
          }
          .tl-txt-new {
            font-family: "SubBold", sans-serif;
            font-size: 26.5px;
            color: #FFFFFF;
            white-space: nowrap;
          }
          .tl-txt-new .gold { color: #FACC15; }
