  }
  .arrow {
    font-family: "SubBold", sans-serif;
    font-size: 32px;
    color: #F59E0B;
    text-align: center;

  .meta {
    font-family: "SubMed", sans-serif;
    font-size: 26px;
    color: #CBD5E1;
    letter-spacing: -0.0109em !important;
