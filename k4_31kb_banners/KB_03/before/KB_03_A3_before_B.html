<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: 'BannerBold';
    src: url('file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDRMNeue-Black.woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'BannerReg';
    src: url('file:///Users/vietmac/Documents/CODE/fedu-font/fonts/FDRMNeue-SemiBold.woff2');
    font-weight: 400;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    background: #090D18;
    font-family: 'BannerReg', -apple-system, sans-serif;
  }
  .portrait-bg {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1350px;
    object-fit: cover;
    object-position: center 25%;
    z-index: 1;
  }
  .bottom-scrim {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 760px;
    background: linear-gradient(to bottom, rgba(6, 9, 18, 0) 0%, rgba(6, 9, 18, 0.55) 38%, rgba(6, 9, 18, 0.88) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .text-card {
    position: absolute;
    left: 44px;
    right: 44px;
    bottom: 42px;
    background: rgba(9, 13, 24, 0.93);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    border-top: 5px solid #F59E0B;
    border-radius: 28px;
    padding: 34px 40px 32px 40px;
    box-shadow: 0 28px 68px rgba(0, 0, 0, 0.72);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 18px;
  }
  .hook-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.12);
    color: #FBBF24;
    font-family: 'BannerBold', sans-serif;
    font-size: 37.6px;
    line-height: 1.3;
    padding: 8px 18px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    border: 1px solid rgba(255,255,255,0.14);
  }
  .headline {
    font-family: 'BannerBold', sans-serif;
    font-size: 95.14px;
    line-height: 1.382;
    letter-spacing: -0.015em;
    color: #FBBF24;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    font-kerning: normal;
  }
  .h-line {
    display: block;
    width: 100%;
  }
  .h-line-1 {
    color: #FBBF24;
  }
  .h-line-2 {
    color: #FFFFFF;
  }
  .subline {
    font-family: 'BannerReg', sans-serif;
    font-size: 42.68px;
    line-height: 1.42;
    letter-spacing: 0em;
    color: #F1F5F9;
    max-width: 910px;
  }
  .bottom-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid rgba(148, 163, 184, 0.22);
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #F59E0B;
    color: #090D18;
    font-family: 'BannerBold', sans-serif;
    font-size: 46.15px;
    line-height: 1.25;
    padding: 14px 28px;
    border-radius: 12px;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .meta-badge {
    font-family: 'BannerReg', sans-serif;
    font-size: 36.7px;
    line-height: 1.35;
    color: #CBD5E1;
    text-align: right;
  }
</style>
</head>
<body>
  <img class="portrait-bg" id="portrait-bg" src="file:///Users/vietmac/Documents/CODE/k/k4_31kb_banners/assets/portraits/C26_I03.jpg" />
  <div class="bottom-scrim"></div>
  <div class="text-card" id="text-card" data-safe-top="780">
    <div class="hook-pill" id="hook-pill">ĐỪNG XIN LƯỢT XEM</div>
    <h1 class="headline" id="headline"><span class="h-line h-line-1">Bước lên ống kính</span><span class="h-line h-line-2">như người tặng quà</span></h1>
    <p class="subline" id="subline">Chia sẻ điều có ích, người cùng tần số sẽ ở lại.</p>
    <div class="bottom-row" id="bottom-row">
      <div class="cta-btn" id="cta-btn">Xem lịch học</div>
    </div>
  </div>
</body>
</html>
