<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Hub Full-Text Search Test (Pagefind)</title>
    <link href="/_pagefind/pagefind-ui.css" rel="stylesheet">
    <script src="/_pagefind/pagefind-ui.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            color: #1e293b;
        }
        /* Customizing Pagefind UI to match FEDU style */
        .pagefind-ui__search-input {
            font-weight: normal;
        }
        .pagefind-ui__result-title {
            color: #2563eb;
            font-weight: bold;
        }
        .pagefind-ui__result-excerpt mark {
            background-color: #fef08a;
            color: #0f172a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Omni-Hub Core Search (Full-Text Test)</h1>
        <div id="search"></div>
    </div>
    
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            new PagefindUI({ 
                element: "#search", 
                showSubResults: true,
                showImages: false, // Vì web toàn text
                pageSize: 10
            });
        });
    </script>
</body>
</html>
