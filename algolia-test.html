<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Hub Algolia Search (Pro)</title>
    <!-- Algolia InstantSearch CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.1.0/themes/satellite-min.css">
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            color: #1e293b;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        /* Custom Algolia UI */
        .ais-SearchBox-input {
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-family: inherit;
        }
        .ais-SearchBox-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .ais-Hits-item {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: none;
            transition: all 0.2s;
            width: 100%; /* Fix width */
        }
        .ais-Hits-item:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
        }
        .ais-Hits-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hit-repo {
            display: inline-block;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 8px;
        }
        .hit-filename {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            margin-bottom: 8px;
            margin-left: 8px;
        }
        
        .hit-title {
            font-size: 18px;
            font-weight: 600;
            color: #2563eb;
            margin: 0 0 10px 0;
            text-decoration: none;
        }
        .hit-title a {
            color: inherit;
            text-decoration: none;
        }
        .hit-content {
            font-size: 14px;
            color: #334155;
            line-height: 1.6;
        }
        /* Highlight match */
        mark {
            background-color: #fef08a;
            color: #0f172a;
            font-weight: bold;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Omni-Hub Search (Algolia Pro)</h1>
        <p class="subtitle">Thách thức gõ "xaykenh", gõ không dấu, sai chính tả</p>
        
        <div id="searchbox"></div>
        <div id="stats" style="margin: 15px 0; color: #64748b; font-size: 13px;"></div>
        <div id="hits"></div>
    </div>

    <!-- Algolia Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4.20.0/dist/algoliasearch-lite.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.57.0/dist/instantsearch.production.min.js"></script>

    <script>
        const searchClient = algoliasearch('0RFLVRCT8K', '3f1a40b667cd28f3edb610b909a0dc7d');

        const search = instantsearch({
            indexName: 'omni_hub_index',
            searchClient,
        });

        search.addWidgets([
            instantsearch.widgets.searchBox({
                container: '#searchbox',
                placeholder: 'Gõ thử: xaykenh, xay kenh, xây kênh...',
                autofocus: true,
                showSubmit: false,
                showReset: true,
            }),
            
            instantsearch.widgets.stats({
                container: '#stats',
                templates: {
                    text(hit) {
                        return `⚡ Tìm thấy ${hit.nbHits} bài viết trong ${hit.processingTimeMS}ms`;
                    }
                }
            }),

            instantsearch.widgets.hits({
                container: '#hits',
                templates: {
                    item(hit) {
                        // Safe fallback handling to prevent rendering crash
                        const repo = hit.repo || 'unknown';
                        const filename = hit._highlightResult?.filename?.value || hit.filename || 'unknown.html';
                        const title = hit._highlightResult?.title?.value || hit.title || filename;
                        const content = hit._snippetResult?.content?.value || hit.content?.substring(0, 100) + '...' || '';
                        const url = hit.url || '#';

                        return `
                            <article>
                                <span class="hit-repo">${repo}</span>
                                <span class="hit-filename">📄 ${filename}</span>
                                <h2 class="hit-title">
                                    <a href="${url}" target="_blank">
                                        ${title}
                                    </a>
                                </h2>
                                <div class="hit-content">
                                    ${content}
                                </div>
                            </article>
                        `;
                    },
                },
            })
        ]);

        search.start();
    </script>
</body>
</html>
